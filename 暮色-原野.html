<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>暮色 · 原野</title>
  <style>
    body { margin:0; overflow:hidden; background:#1a0a20; font-family:"Microsoft YaHei",serif; }
    #info {
      position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
      color:rgba(255,200,150,0.25); font-size:12px; letter-spacing:2px;
      background:rgba(0,0,0,0.15); padding:4px 16px; border-radius:12px;
      pointer-events:none;
    }
  </style>
</head>
<body>
<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

const R = Math.random, S = Math.sin, C = Math.cos;

const scene = new THREE.Scene();

// ── Sky ──
const c = document.createElement('canvas');
c.width = 2; c.height = 512;
const x = c.getContext('2d');
const gr = x.createLinearGradient(0,0,0,512);
gr.addColorStop(0,'#0a0018');
gr.addColorStop(0.2,'#2a0a30');
gr.addColorStop(0.4,'#8a2a4a');
gr.addColorStop(0.55,'#dd6644');
gr.addColorStop(0.7,'#ffaa66');
gr.addColorStop(0.85,'#ffcc88');
gr.addColorStop(1,'#ffe0b0');
x.fillStyle=gr; x.fillRect(0,0,2,512);
scene.background = new THREE.CanvasTexture(c);
scene.fog = new THREE.FogExp2(0xddbb99, 0.002);

const camera = new THREE.PerspectiveCamera(28, innerWidth/innerHeight, 0.1, 200);
camera.position.set(10, 5, 12);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.3, 0.15, 0.05));

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI/2.3; controls.minDistance = 3;
controls.update();

// ── Lights ──
scene.add(new THREE.AmbientLight(0xffbb88, 0.3));
scene.add(new THREE.HemisphereLight(0xffccaa, 0x553322, 0.6));
const sun = new THREE.DirectionalLight(0xffcc88, 2.5);
sun.position.set(8, 12, -6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 30;
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xff8844, 0.6);
rim.position.set(-6, 3, -8);
scene.add(rim);
const fill = new THREE.DirectionalLight(0x88ccff, 0.15);
fill.position.set(0, -2, 6);
scene.add(fill);

// ── Terrain ──
const terrainGeo = new THREE.PlaneGeometry(50, 50, 60, 60);
const pos = terrainGeo.attributes.position.array;
for (let i=0; i<pos.length; i+=3) {
  const x = pos[i], z = pos[i+2];
  const dist = Math.sqrt(x*x + z*z);
  pos[i+1] = Math.exp(-dist*dist/40) * 0.6 +
             Math.exp(-((x+2)*(x+2)+(z-3)*(z-3))/8) * 0.3 +
             Math.exp(-((x-3)*(x-3)+(z+2)*(z+2))/10) * 0.25 +
             Math.exp(-((x-4)*(x-4)+(z-5)*(z-5))/6) * 0.2;
}
terrainGeo.computeVertexNormals();
const terrainMat = new THREE.MeshStandardMaterial({
  color: 0xccaa66, roughness: 0.85, metalness: 0,
  flatShading: false,
});
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.rotation.x = -Math.PI/2;
terrain.receiveShadow = true; terrain.castShadow = true;
scene.add(terrain);

// ── Tree ──
function makeTree(x, z, s) {
  const g = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7a6a4a, roughness: 0.85 });
  const woodMat = new THREE.MeshStandardMaterial({ color: 0x8a7a5a, roughness: 0.8 });

  // Trunk
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06*s, 0.18*s, 1.2*s, 8), trunkMat);
  trunk.position.y = 0.6*s; trunk.castShadow = true;
  trunk.rotation.z = 0.03; trunk.rotation.x = -0.02;
  g.add(trunk);

  // Main branches
  for (let i=0; i<7; i++) {
    const a = (i/7)*Math.PI*2 + R()*0.2;
    const len = (0.3 + R()*0.35)*s;
    const br = new THREE.Mesh(new THREE.CylinderGeometry(0.025*s, 0.06*s, len, 5), woodMat);
    br.position.set(C(a)*0.12*s, 0.5*s + R()*0.35*s, S(a)*0.12*s);
    br.rotation.z = C(a)*(0.5+R()*0.2);
    br.rotation.x = S(a)*(0.5+R()*0.2);
    br.castShadow = true; g.add(br);

    // Sub-branch
    if (R()>0.4) {
      const sa = a + (R()-0.5)*0.6;
      const sb = new THREE.Mesh(new THREE.CylinderGeometry(0.015*s, 0.03*s, (0.15+R()*0.15)*s, 4), woodMat);
      sb.position.set(
        C(a)*0.12*s + C(sa)*0.08*s,
        0.55*s + R()*0.3*s,
        S(a)*0.12*s + S(sa)*0.08*s
      );
      sb.rotation.z = C(sa)*0.6; sb.rotation.x = S(sa)*0.6;
      g.add(sb);
    }
  }

  // Foliage: large soft clusters, few but beautiful
  const cols = [0xddbb77, 0xeebb66, 0xccaa55, 0xeedd88, 0xddaa55];
  // Big central masses
  for (let c=0; c<10; c++) {
    const a = R()*Math.PI*2;
    const r = (0.05 + R()*0.35)*s;
    const y = 0.7*s + (R()-0.3)*0.4*s;
    const sz = (0.10 + R()*0.12)*s;
    const col = cols[Math.floor(R()*cols.length)];
    const mat = new THREE.MeshStandardMaterial({
      color: col, roughness: 0.6,
      emissive: col, emissiveIntensity: 0.03,
    });
    const l = new THREE.Mesh(new THREE.SphereGeometry(sz, 6, 6), mat);
    l.position.set(C(a)*r, y, S(a)*r);
    l.scale.set(1, 0.7+R()*0.4, 1);
    g.add(l);

    // Small accent cluster nearby
    if (R()>0.5) {
      const s2 = sz*(0.5+R()*0.3);
      const l2 = new THREE.Mesh(new THREE.SphereGeometry(s2, 5, 5), mat);
      l2.position.set(C(a)*r+(R()-0.5)*s2*2, y+(R()-0.5)*s2, S(a)*r+(R()-0.5)*s2*2);
      l2.scale.set(1, 0.6+R()*0.3, 1);
      g.add(l2);
    }
  }

  // Outlying clusters (silhouette)
  for (let c=0; c<8; c++) {
    const a = R()*Math.PI*2;
    const r = (0.35 + R()*0.35)*s;
    const y = 0.75*s + (R()-0.3)*0.35*s;
    const sz = (0.06 + R()*0.08)*s;
    const col = cols[Math.floor(R()*cols.length)];
    const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.5, emissive: col, emissiveIntensity: 0.03 });
    const l = new THREE.Mesh(new THREE.SphereGeometry(sz, 5, 5), mat);
    l.position.set(C(a)*r, y, S(a)*r);
    l.scale.set(1, 0.5+R()*0.4, 1);
    g.add(l);
  }

  g.position.set(x, 0, z);
  return g;
}
scene.add(makeTree(0.5, 0.2, 2.5));

// ── Small trees ──
for (let i=0; i<5; i++) {
  const a = R()*Math.PI*2, r = 2+R()*3;
  const g = new THREE.Group();
  const s = 0.5+R()*0.4;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.025*s, 0.05*s, 0.5*s, 4),
    new THREE.MeshStandardMaterial({ color: 0x7a6a4a }));
  trunk.position.y = 0.25*s; g.add(trunk);
  const cols = [0xddbb77, 0xeebb66, 0xccaa55];
  for (let c=0; c<5; c++) {
    const ca = R()*Math.PI*2, cr = (0.05+R()*0.18)*s;
    const col = cols[Math.floor(R()*cols.length)];
    const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.5, emissive: col, emissiveIntensity: 0.03 });
    const l = new THREE.Mesh(new THREE.SphereGeometry((0.04+R()*0.05)*s, 4, 4), mat);
    l.position.set(C(ca)*cr, (0.3+R()*0.15)*s, S(ca)*cr);
    g.add(l);
  }
  g.position.set(C(a)*r, 0, S(a)*r);
  scene.add(g);
}

// ── Floating light wisps ──
const wispCount = 60;
const wg = new THREE.BufferGeometry();
const wp = new Float32Array(wispCount*3);
for (let i=0; i<wispCount; i++) {
  wp[i*3] = (R()-0.5)*14;
  wp[i*3+1] = 0.3+R()*3;
  wp[i*3+2] = (R()-0.5)*10;
}
wg.setAttribute('position', new THREE.BufferAttribute(wp, 3));
const wisps = new THREE.Points(wg, new THREE.PointsMaterial({
  color: 0xffdd88, size: 0.03, transparent: true, opacity: 0.4,
  blending: THREE.AdditiveBlending
}));
scene.add(wisps);

// ── Stars ──
const sg = new THREE.BufferGeometry();
const sp = new Float32Array(300*3);
for (let i=0; i<300; i++) {
  const r = 35+R()*40, th = R()*Math.PI*2, ph = Math.acos(2*R()-1);
  sp[i*3] = r*S(ph)*C(th);
  sp[i*3+1] = Math.abs(r*C(ph));
  sp[i*3+2] = r*S(ph)*S(th);
}
sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color:0xffffff, size:0.08, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending })));

// ── Distant clouds ──
const cloudGroup = new THREE.Group();
const cmat = new THREE.MeshStandardMaterial({ color:0xffccaa, transparent:true, opacity:0.05, roughness:0.5 });
for (let i=0; i<60; i++) {
  const a = R()*Math.PI*2, r = 6+R()*10, s = 0.5+R()*1.2;
  const cl = new THREE.Mesh(new THREE.SphereGeometry(s, 6, 6), cmat);
  cl.position.set(C(a)*r, -0.2+R()*0.4, S(a)*r);
  cl.scale.set(1.5+R()*0.5, 0.2+R()*0.15, 1);
  cloudGroup.add(cl);
}
scene.add(cloudGroup);

// ── Distant mountains ──
const mmat = new THREE.MeshStandardMaterial({ color:0x998877, roughness:0.9, transparent:true, opacity:0.1 });
[-14, -8, 10, 16].forEach((x, i) => {
  const m = new THREE.Mesh(new THREE.ConeGeometry(3+R()*3, 2+R()*2, 6), mmat);
  m.position.set(x, 0, -12-R()*5-i*2);
  scene.add(m);
});

// ── Long grass blades ──
const grassCount = 800;
const gg = new THREE.BufferGeometry();
const gp = new Float32Array(grassCount*3);
for (let i=0; i<grassCount; i++) {
  const a = R()*Math.PI*2, r = 1+R()*6;
  gp[i*3] = C(a)*r;
  gp[i*3+1] = 0;
  gp[i*3+2] = S(a)*r;
}
gg.setAttribute('position', new THREE.BufferAttribute(gp, 3));
const grassPts = new THREE.Points(gg, new THREE.PointsMaterial({
  color: 0xccbb66, size: 0.015, transparent: true, opacity: 0.3
}));
scene.add(grassPts);

// ── Light particles (golden dust) ──
const dustCount = 200;
const dg = new THREE.BufferGeometry();
const dp = new Float32Array(dustCount*3);
for (let i=0; i<dustCount; i++) {
  dp[i*3] = (R()-0.5)*16;
  dp[i*3+1] = R()*4;
  dp[i*3+2] = (R()-0.5)*12;
}
dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
const dust = new THREE.Points(dg, new THREE.PointsMaterial({
  color: 0xffdd88, size: 0.015, transparent: true, opacity: 0.2,
  blending: THREE.AdditiveBlending
}));
scene.add(dust);

// ── Animation ──
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.005;

  // Wisps drift
  const wa = wisps.geometry.attributes.position.array;
  for (let i=0; i<wa.length; i+=3) {
    wa[i] += S(t*0.4+i*0.1)*0.004;
    wa[i+1] += C(t*0.3+i*0.2)*0.003;
    wa[i+2] += C(t*0.35+i*0.15)*0.004;
  }
  wisps.geometry.attributes.position.needsUpdate = true;

  // Dust drift
  const da = dust.geometry.attributes.position.array;
  for (let i=0; i<da.length; i+=3) {
    da[i] += S(t*0.2+i*0.05)*0.002;
    da[i+1] += S(t*0.15+i*0.08)*0.001;
  }
  dust.geometry.attributes.position.needsUpdate = true;

  // Grass sway
  const ga = grassPts.geometry.attributes.position.array;
  for (let i=0; i<ga.length; i+=3) {
    ga[i] += S(t+ga[i])*0.001;
  }
  grassPts.geometry.attributes.position.needsUpdate = true;

  controls.update();
  composer.render();
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  composer.setSize(innerWidth, innerHeight);
});
</script>
<div id="info">🖱 拖拽 · 滚轮 · 暮色原野</div>
</body>
</html>
