<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>鸾 · Ori 意境</title>
  <style>
    body { margin:0; overflow:hidden; background:#080418; font-family:"Microsoft YaHei",serif; }
    #info {
      position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
      color:rgba(255,230,200,0.3); font-size:12px; letter-spacing:2px;
      background:rgba(0,0,0,0.3); padding:4px 16px; border-radius:12px;
      pointer-events:none; backdrop-filter:blur(4px);
    }
  </style>
</head>
<body>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080418);
scene.fog = new THREE.FogExp2(0x080418, 0.018);

const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 100);
camera.position.set(9, 5, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.6;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.5, 0.08);
composer.addPass(bloom);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI / 2.1;
controls.update();

// ── Lights ──
scene.add(new THREE.AmbientLight(0x2233aa, 0.25));
const backlight = new THREE.DirectionalLight(0x6644ff, 0.5);
backlight.position.set(-5, 8, -8);
scene.add(backlight);
const warmKey = new THREE.DirectionalLight(0xffaa44, 1.2);
warmKey.position.set(4, 6, 6);
warmKey.castShadow = true;
warmKey.shadow.mapSize.set(2048,2048);
warmKey.shadow.camera.near = 0.5; warmKey.shadow.camera.far = 25;
warmKey.shadow.camera.left = -8; warmKey.shadow.camera.right = 8;
warmKey.shadow.camera.top = 8; warmKey.shadow.camera.bottom = -8;
scene.add(warmKey);
scene.add(new THREE.DirectionalLight(0x88ddff, 0.3).position.set(0, 2, -6));

// ── Ground ──
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x0a0a2a, roughness: 0.95, emissive: 0x111144, emissiveIntensity: 0.08 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Glowing grass dots
const grassCount = 2500;
const gg = new THREE.BufferGeometry();
const gp = new Float32Array(grassCount*3), gc = new Float32Array(grassCount*3);
for (let i=0; i<grassCount; i++) {
  const a = Math.random()*Math.PI*2, r = Math.random()*14-4 > 2 ? Math.random()*10 : 1+Math.random()*3;
  gp[i*3] = Math.cos(a)*r; gp[i*3+1] = 0.01; gp[i*3+2] = Math.sin(a)*r + 1;
  gc[i*3] = 0.1+Math.random()*0.2; gc[i*3+1] = 0.3+Math.random()*0.3; gc[i*3+2] = 0.6+Math.random()*0.4;
}
gg.setAttribute('position', new THREE.BufferAttribute(gp, 3));
gg.setAttribute('color', new THREE.BufferAttribute(gc, 3));
scene.add(new THREE.Points(gg, new THREE.PointsMaterial({ size:0.04, vertexColors:true, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending })));

// ── Spirit Trees ──
function spiritTree(x, z, s) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.05*s, 0.12*s, 1.0*s, 6),
    new THREE.MeshStandardMaterial({ color: 0x1a0a1a, roughness: 0.8, emissive: 0x2a0a2a, emissiveIntensity: 0.05 }));
  trunk.position.y = 0.5*s; trunk.castShadow = true; g.add(trunk);

  for (let i=0; i<6; i++) {
    const a = Math.random()*Math.PI*2;
    const br = new THREE.Mesh(new THREE.CylinderGeometry(0.02*s, 0.035*s, 0.3*s+Math.random()*0.3*s, 4),
      new THREE.MeshStandardMaterial({ color: 0x1a0a1a, roughness: 0.8 }));
    br.position.set(Math.cos(a)*0.06*s, 0.6*s+Math.random()*0.2*s, Math.sin(a)*0.06*s);
    br.rotation.z = Math.cos(a)*0.6; br.rotation.x = Math.sin(a)*0.6;
    g.add(br);
  }

  const leafColors = [0x88ddff, 0x66aaff, 0x4488ff, 0xaae0ff];
  for (let i=0; i<30; i++) {
    const a = Math.random()*Math.PI*2, r = (0.15+Math.random()*0.45)*s;
    const col = leafColors[Math.floor(Math.random()*leafColors.length)];
    const leaf = new THREE.Mesh(new THREE.SphereGeometry((0.08+Math.random()*0.12)*s, 6, 6),
      new THREE.MeshStandardMaterial({ color:col, emissive:col, emissiveIntensity:0.5+Math.random()*0.5, transparent:true, opacity:0.3+Math.random()*0.3 }));
    leaf.position.set(Math.cos(a)*r, (0.8+Math.random()*0.6)*s, Math.sin(a)*r);
    leaf.scale.set(1, 0.6+Math.random()*0.4, 1);
    g.add(leaf);
  }

  const core = new THREE.Mesh(new THREE.SphereGeometry(0.06*s, 8, 8),
    new THREE.MeshStandardMaterial({ color:0x88ddff, emissive:0x88ddff, emissiveIntensity:3 }));
  core.position.y = 1.3*s; g.add(core);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.15*s, 8, 8),
    new THREE.MeshStandardMaterial({ color:0x88ddff, emissive:0x88ddff, emissiveIntensity:1.5, transparent:true, opacity:0.15 }));
  glow.position.y = 1.3*s; g.add(glow);
  const pt = new THREE.PointLight(0x88ddff, 0.6, 5);
  pt.position.y = 1.3*s; g.add(pt);
  g.position.set(x, 0, z); return g;
}

scene.add(spiritTree(-4.5, 3.0, 1.6));
scene.add(spiritTree(4.5, 3.0, 1.4));
scene.add(spiritTree(0, 5.5, 1.8));

// ── Ori Palace ──
function oriPalace(x, z, s) {
  const g = new THREE.Group();
  const wallMat = new THREE.MeshStandardMaterial({ color:0xcc4466, roughness:0.3, metalness:0.1, emissive:0xcc4466, emissiveIntensity:0.08, transparent:true, opacity:0.85 });
  const roofMat = new THREE.MeshStandardMaterial({ color:0x1a0a20, roughness:0.4, metalness:0.1, emissive:0x442266, emissiveIntensity:0.1 });
  const glowMat = new THREE.MeshStandardMaterial({ color:0x88ddff, emissive:0x88ddff, emissiveIntensity:2, transparent:true, opacity:0.2 });

  for (let i=0; i<3; i++) {
    const w = (4.0-i*0.3)*s, d = (2.8-i*0.2)*s;
    const tier = new THREE.Mesh(new THREE.BoxGeometry(w, 0.10*s, d),
      new THREE.MeshStandardMaterial({ color:0x5a4a5a, roughness:0.7, emissive:0x332244, emissiveIntensity:0.05 }));
    tier.position.y = (0.08+i*0.12)*s; tier.castShadow = true; tier.receiveShadow = true;
    g.add(tier);
    const edge = new THREE.Mesh(new THREE.BoxGeometry(w, 0.015, 0.015), glowMat);
    edge.position.set(0, (0.08+i*0.12)*s+0.01, d/2);
    g.add(edge);
  }

  const wall = new THREE.Mesh(new THREE.BoxGeometry(3.2*s, 1.0*s, 2.0*s), wallMat);
  wall.position.y = (0.6+0.18)*s; wall.castShadow = true; g.add(wall);

  [-0.6,0,0.6].forEach(dx => {
    [-0.4,0.4].forEach(dz => {
      const win = new THREE.Mesh(new THREE.BoxGeometry(0.22*s, 0.28*s, 0.02),
        new THREE.MeshStandardMaterial({ color:0xffdd88, emissive:0xff8844, emissiveIntensity:2.5 }));
      win.position.set(dx*s, (0.5+0.18)*s, dz*s);
      g.add(win);
    });
  });

  for (let i=-1; i<=1; i+=2) for (let j=-1; j<=1; j+=2) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.06*s, 0.08*s, 1.1*s, 6),
      new THREE.MeshStandardMaterial({ color:0xdd5588, roughness:0.3, emissive:0xff4488, emissiveIntensity:0.15 }));
    p.position.set(i*1.4*s, (0.6+0.18)*s, j*0.8*s); p.castShadow = true; g.add(p);
  }

  [[2.6*s,0.25*s,1.72*s],[2.3*s,0.20*s,1.85*s],[2.0*s,0.18*s,1.97*s],[1.7*s,0.30*s,2.18*s],[1.5*s,0.25*s,2.30*s],[1.3*s,0.22*s,2.42*s]].forEach(([w,h,y])=>{
    const r = new THREE.Mesh(new THREE.ConeGeometry(w, h, 8), roofMat);
    r.position.y = y; r.rotation.y = Math.PI/8; r.castShadow = true; g.add(r);
  });

  [-2.2*s,2.2*s].forEach(dx => {
    [-1.5*s,1.5*s].forEach(dz => {
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.03*s,6,6),
        new THREE.MeshStandardMaterial({ color:0x88ddff, emissive:0x88ddff, emissiveIntensity:2.5 }));
      tip.position.set(dx, (1.9+0.18)*s, dz); g.add(tip);
    });
  });

  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.4*s,0.02*s,6,24),
    new THREE.MeshStandardMaterial({ color:0x88ddff, emissive:0x88ddff, emissiveIntensity:1.5 }));
  ring.position.y = 1.85*s; ring.rotation.x = Math.PI/2; g.add(ring);

  g.position.set(x, 0, z); return g;
}

scene.add(oriPalace(0, -2.5, 1.0));
scene.add(oriPalace(-4.0, -4.0, 0.75));
scene.add(oriPalace(4.0, -4.0, 0.75));

// ── Bridge ──
const bridge = new THREE.Group();
const bMat = new THREE.MeshStandardMaterial({ color:0x6a5a7a, roughness:0.7, emissive:0x332244, emissiveIntensity:0.05 });
for (let i=0; i<7; i++) {
  const t = (i/6)*Math.PI;
  const seg = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.04,0.7), bMat);
  seg.position.set(Math.cos(t)*1.0-0.15, Math.sin(t)*0.3+0.03, 0);
  seg.rotation.z = (i/6-0.5)*0.5; bridge.add(seg);
}
bridge.add(new THREE.Mesh(new THREE.BoxGeometry(2.0,0.03,0.8), bMat).translateY(0.28));
const bGlow = new THREE.Mesh(new THREE.BoxGeometry(1.8,0.015,0.015),
  new THREE.MeshStandardMaterial({ color:0x88ddff, emissive:0x88ddff, emissiveIntensity:1.5 }));
bGlow.position.set(0,0.31,0.42); bridge.add(bGlow);
bridge.position.set(0,0,2.2);
scene.add(bridge);

// ── Pond ──
const pond = new THREE.Mesh(new THREE.CircleGeometry(1.6,20),
  new THREE.MeshPhysicalMaterial({ color:0x1a2a6a, roughness:0.05, metalness:0, transparent:true, opacity:0.5 }));
pond.rotation.x = -Math.PI/2; pond.position.set(0,0.01,1.8);
scene.add(pond);

// ── Glowing flowers ──
const fcols = [0xff6699,0xff8844,0xffee44,0x66ffaa,0x88ddff,0xff44aa];
for (let i=0; i<60; i++) {
  const col = fcols[Math.floor(Math.random()*fcols.length)];
  const f = new THREE.Mesh(new THREE.SphereGeometry(0.02+Math.random()*0.025,6,6),
    new THREE.MeshStandardMaterial({ color:col, emissive:col, emissiveIntensity:2 }));
  const a = Math.random()*Math.PI*2, r = 1.5+Math.random()*4;
  f.position.set(Math.cos(a)*r, 0.02, Math.sin(a)*r+1);
  scene.add(f);
}

// ── Lanterns ──
function oriLantern(x, y, z) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8),
    new THREE.MeshStandardMaterial({ color:0xff8844, emissive:0xff6622, emissiveIntensity:1.5 })));
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8),
    new THREE.MeshStandardMaterial({ color:0xff6622, emissive:0xff6622, emissiveIntensity:1, transparent:true, opacity:0.1 })));
  const l = new THREE.PointLight(0xff6622, 0.5, 4);
  g.add(l);
  g.position.set(x, y, z);
  scene.add(g);
}
[-2.0,0,2.0].forEach(dx => oriLantern(dx, 1.8, -1.5));
[-1.0,1.0].forEach(dx => oriLantern(dx, 1.4, 2.0));

// ── Floating orbs ──
const orbCount = 120;
const og = new THREE.BufferGeometry();
const op = new Float32Array(orbCount*3), os = new Float32Array(orbCount);
for (let i=0; i<orbCount; i++) {
  const a = Math.random()*Math.PI*2, r = 0.5+Math.random()*5;
  op[i*3] = Math.cos(a)*r; op[i*3+1] = 0.3+Math.random()*3.5; op[i*3+2] = Math.sin(a)*r+1;
  os[i] = 0.5+Math.random()*1.5;
}
og.setAttribute('position', new THREE.BufferAttribute(op, 3));
const orbs = new THREE.Points(og, new THREE.PointsMaterial({ color:0x88ddff, size:0.04, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, sizeAttenuation:true }));
scene.add(orbs);

// ── Wisps ──
const wg = new THREE.BufferGeometry();
const wp = new Float32Array(80*3);
for (let i=0; i<80; i++) { wp[i*3]=(Math.random()-0.5)*8; wp[i*3+1]=Math.random()*2; wp[i*3+2]=(Math.random()-0.5)*6+1; }
wg.setAttribute('position', new THREE.BufferAttribute(wp, 3));
const wisps = new THREE.Points(wg, new THREE.PointsMaterial({ color:0xffcc88, size:0.015, transparent:true, opacity:0.4, blending:THREE.AdditiveBlending }));
scene.add(wisps);

// ── Butterflies ──
function bfly(x,y,z) {
  const g = new THREE.Group();
  const wMat = new THREE.MeshStandardMaterial({ color:0x88ddff, emissive:0x88ddff, emissiveIntensity:1.5, transparent:true, opacity:0.4, side:THREE.DoubleSide });
  [-1,1].forEach(side => {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(0.06,0.04), wMat);
    w.position.set(side*0.03,0,0); w.rotation.y=side*0.3; g.add(w);
  });
  g.position.set(x,y,z); scene.add(g); return g;
}
const b1=bfly(-1.5,1.2,1.0), b2=bfly(1.8,0.8,1.5), b3=bfly(-0.5,1.5,0.5);

// ── Stars ──
const sg = new THREE.BufferGeometry();
const sp = new Float32Array(400*3);
for (let i=0; i<400; i++) {
  const r=30+Math.random()*30, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
  sp[i*3]=r*Math.sin(ph)*Math.cos(th); sp[i*3+1]=Math.abs(r*Math.cos(ph)); sp[i*3+2]=r*Math.sin(ph)*Math.sin(th);
}
sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color:0xffffff, size:0.06, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending })));

// ── Animation ──
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.008;

  const opa = orbs.geometry.attributes.position.array;
  for (let i=0; i<opa.length; i+=3) {
    opa[i] += Math.sin(t*os[i/3]+i)*0.004;
    opa[i+1] += Math.cos(t*0.7+i*0.5)*0.003;
    opa[i+2] += Math.cos(t*os[i/3]*0.8+i)*0.004;
  }
  orbs.geometry.attributes.position.needsUpdate = true;

  const wpa = wisps.geometry.attributes.position.array;
  for (let i=0; i<wpa.length; i+=3) {
    wpa[i+1] += 0.003;
    if (wpa[i+1] > 2.5) { wpa[i]=(Math.random()-0.5)*8; wpa[i+1]=0; wpa[i+2]=(Math.random()-0.5)*6+1; }
  }
  wisps.geometry.attributes.position.needsUpdate = true;

  [b1,b2,b3].forEach((b, idx) => {
    b.position.x += Math.sin(t*0.8+idx*2)*0.005;
    b.position.y += Math.sin(t*1.2+idx*3)*0.004;
    b.rotation.y = Math.sin(t*0.5+idx)*0.5;
    b.children.forEach((ch,i) => { ch.rotation.y = (i===0?-1:1)*(0.3+Math.sin(t*3+idx)*0.15); });
  });

  scene.children.filter(c=>c.isGroup&&c.children.some(ch=>ch instanceof THREE.PointLight))
    .forEach((g,idx)=>{const l=g.children.find(ch=>ch instanceof THREE.PointLight);if(l)l.intensity=0.4+Math.sin(t*2+idx)*0.15;});

  controls.update();
  composer.render();
}
animate();
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  composer.setSize(innerWidth, innerHeight);
});
</script>
<div id="info">🖱 拖拽 · 滚轮 · Ori 风 · 灵树 · 浮光</div>
</body>
</html>
