<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>怪兽大破坏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: "Helvetica Neue", Arial, sans-serif; }
canvas { display: block; }
#ui { position: fixed; top: 16px; left: 16px; z-index: 20; pointer-events: none; }
#ui > * { pointer-events: auto; }
#score { color: #ffcc88; font-size: 22px; letter-spacing: 2px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
#score span { color: #ff6644; font-weight: bold; }
#hint { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); color: rgba(255,200,140,0.5); font-size: 13px; letter-spacing: 1px; z-index: 20; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,0.6); text-align: center; }
#title { position: fixed; top: 16px; right: 16px; color: rgba(255,180,100,0.3); font-size: 18px; letter-spacing: 4px; z-index: 10; text-shadow: 0 2px 12px rgba(0,0,0,0.6); font-weight: 200; pointer-events: none; }
#controls { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); color: rgba(255,200,140,0.6); font-size: 12px; letter-spacing: 1px; z-index: 20; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,0.8); opacity: 0; transition: opacity 1s; text-align: center; line-height: 1.8; }
#controls.show { opacity: 1; }
#restart { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 14px 32px; border: 1px solid rgba(255,200,140,0.3); background: rgba(0,0,0,0.6); color: rgba(255,200,140,0.8); font-size: 16px; letter-spacing: 2px; border-radius: 6px; cursor: pointer; backdrop-filter: blur(6px); z-index: 30; display: none; font-family: inherit; }
#restart:hover { background: rgba(0,0,0,0.8); border-color: rgba(255,200,140,0.6); }
#destroyed { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); color: rgba(255,200,140,0.6); font-size: 18px; letter-spacing: 2px; z-index: 25; pointer-events: none; text-align: center; display: none; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
</style>
</head>
<body>
<div id="title">怪兽大破坏</div>
<div id="ui"><div id="score">破坏: <span id="scoreVal">0</span></div></div>
<div id="hint">🦎 WASD 移动 · 鼠标拖拽视角 · 左键/空格 破坏建筑</div>
<div id="controls" class="show"></div>
<div id="destroyed"></div>
<button id="restart">🔄 重新开始</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function rng(a, b) { return a + Math.random() * (b - a); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

const V3 = THREE.Vector3;

/* ═══════ RENDERER ═══════ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x556688);
scene.fog = new THREE.Fog(0x556688, 25, 50);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);

/* ═══════ MATERIALS ═══════ */
const M = {
  glass1: new THREE.MeshStandardMaterial({ color: 0x3a6a8a, roughness: 0.15, metalness: 0.5 }),
  glass2: new THREE.MeshStandardMaterial({ color: 0x4a7a9a, roughness: 0.15, metalness: 0.45 }),
  glass3: new THREE.MeshStandardMaterial({ color: 0x5a8aaa, roughness: 0.15, metalness: 0.4 }),
  warm1:  new THREE.MeshStandardMaterial({ color: 0xc8b8a0, roughness: 0.6, metalness: 0 }),
  warm2:  new THREE.MeshStandardMaterial({ color: 0xd4c4a8, roughness: 0.55, metalness: 0 }),
  conc1:  new THREE.MeshStandardMaterial({ color: 0xa89880, roughness: 0.7, metalness: 0 }),
  conc2:  new THREE.MeshStandardMaterial({ color: 0x8a7a6a, roughness: 0.75, metalness: 0 }),
  conc3:  new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: 0.8, metalness: 0 }),
  met:    new THREE.MeshStandardMaterial({ color: 0x6a6a6a, roughness: 0.3, metalness: 0.6 }),
  skin:   new THREE.MeshStandardMaterial({ color: 0x4a7a4a, roughness: 0.7, metalness: 0.05 }),
  skinD:  new THREE.MeshStandardMaterial({ color: 0x3a6a3a, roughness: 0.8, metalness: 0 }),
  belly:  new THREE.MeshStandardMaterial({ color: 0x8aaa7a, roughness: 0.7, metalness: 0 }),
  eye:    new THREE.MeshStandardMaterial({ color: 0xffcc44, emissive: 0xff8800, emissiveIntensity: 0.5 }),
  horn:   new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.8, metalness: 0.1 }),
  road:   new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9, metalness: 0 }),
  ground: new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: 0.95, metalness: 0 }),
};
const bldMats = [M.glass1, M.glass2, M.glass3, M.warm1, M.warm2, M.conc1, M.conc2, M.conc3];

/* ═══════ GROUND ═══════ */
const gnd = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), M.ground);
gnd.rotation.x = -Math.PI / 2;
gnd.position.y = -0.02;
gnd.receiveShadow = true;
scene.add(gnd);

/* ═══════ LIGHTING ═══════ */
const sun = new THREE.DirectionalLight(0xffcc88, 1.8);
sun.position.set(10, 15, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 40;
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0x88bbff, 0x448866, 0.35);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0x88aacc, 0.15);
scene.add(ambient);

/* ═══════ CITY ═══════ */
const buildings = [];
const buildingData = []; // { mesh, x, z, w, d, h }

function buildCity() {
  const grid = [];
  const cols = 7, rows = 8;
  const spacing = 1.6;
  const ox = -cols * spacing / 2, oz = -rows * spacing / 2;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const skip = (r === 3 && c === 4) || (r === 4 && c === 3) || (r === 4 && c === 4) || (r === 5 && c === 3);
      if (skip) continue;
      const h = rng(0.6, 0.8 + (rows - r) * 0.35);
      const w = rng(0.4, 0.8) + (c % 2 === 0 ? 0.1 : 0);
      const d = rng(0.4, 0.7);
      grid.push({
        x: ox + c * spacing + rng(-0.1, 0.1),
        z: oz + r * spacing + rng(-0.1, 0.1),
        w, d, h, m: pick(bldMats),
        type: pick(['box', 'podium']),
      });
    }
  }

  grid.forEach(b => {
    const box = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, b.d), b.m);
    box.position.set(b.x, b.h / 2, b.z);
    box.castShadow = true;
    box.receiveShadow = true;
    scene.add(box);
    buildings.push(box);
    buildingData.push({ mesh: box, x: b.x, z: b.z, w: b.w, d: b.d, h: b.h, alive: true, hp: b.h < 1.2 ? 1 : b.h < 2 ? 2 : 3 });

    if (b.type === 'podium') {
      const pw = b.w * 1.3, pd = b.d * 1.3, ph = b.h * 0.15;
      const pod = new THREE.Mesh(new THREE.BoxGeometry(pw, ph, pd), M.conc2);
      pod.position.set(b.x, ph / 2, b.z);
      pod.castShadow = true;
      pod.receiveShadow = true;
      scene.add(pod);
    }

    const floors = Math.floor(b.h / 0.25);
    for (let f = 1; f < floors; f += 2) {
      const band = new THREE.Mesh(new THREE.BoxGeometry(b.w + 0.005, 0.008, 0.01), M.met);
      band.position.set(b.x, f * 0.25, b.z + b.d / 2);
      scene.add(band);
      const band2 = new THREE.Mesh(new THREE.BoxGeometry(b.w + 0.005, 0.008, 0.01), M.met);
      band2.position.set(b.x, f * 0.25, b.z - b.d / 2);
      scene.add(band2);
    }

    /* Roof AC */
    if (b.h > 1.5) {
      for (let a = 0; a < Math.floor(rng(1, 3)); a++) {
        const ac = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.03, 0.05), M.met);
        ac.position.set(b.x + rng(-b.w * 0.2, b.w * 0.2), b.h + 0.015, b.z + rng(-b.d * 0.2, b.d * 0.2));
        scene.add(ac);
      }
    }
  });
}
buildCity();

/* ═══════ MONSTER ═══════ */
const monster = new THREE.Group();

function addLimb(parent, geo, mat, pos, rot) {
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(pos);
  if (rot) m.rotation.set(rot.x || 0, rot.y || 0, rot.z || 0);
  m.castShadow = true;
  parent.add(m);
  return m;
}

/* Torso */
const torso = addLimb(monster, new THREE.BoxGeometry(0.8, 0.9, 0.5), M.skin, new V3(0, 0.65, 0));
/* Belly */
addLimb(monster, new THREE.BoxGeometry(0.5, 0.4, 0.3), M.belly, new V3(0, 0.5, 0.26));
/* Head */
const head = addLimb(monster, new THREE.BoxGeometry(0.4, 0.3, 0.35), M.skin, new V3(0, 1.15, 0.05));
/* Jaw */
addLimb(monster, new THREE.BoxGeometry(0.25, 0.08, 0.2), M.skinD, new V3(0, 0.98, 0.22));
/* Eyes */
addLimb(monster, new THREE.SphereGeometry(0.05, 6, 6), M.eye, new V3(-0.12, 1.2, 0.2));
addLimb(monster, new THREE.SphereGeometry(0.05, 6, 6), M.eye, new V3(0.12, 1.2, 0.2));
/* Horns */
addLimb(monster, new THREE.ConeGeometry(0.04, 0.12, 4), M.horn, new V3(-0.12, 1.35, 0.05));
addLimb(monster, new THREE.ConeGeometry(0.04, 0.12, 4), M.horn, new V3(0.12, 1.35, 0.05));
/* Arms */
const lArm = addLimb(monster, new THREE.BoxGeometry(0.12, 0.5, 0.12), M.skinD, new V3(-0.5, 0.7, 0), new V3(0, 0, 0.25));
const rArm = addLimb(monster, new THREE.BoxGeometry(0.12, 0.5, 0.12), M.skinD, new V3(0.5, 0.7, 0), new V3(0, 0, -0.25));
/* Legs */
const lLeg = addLimb(monster, new THREE.BoxGeometry(0.2, 0.35, 0.2), M.skinD, new V3(-0.2, 0.2, 0));
const rLeg = addLimb(monster, new THREE.BoxGeometry(0.2, 0.35, 0.2), M.skinD, new V3(0.2, 0.2, 0));
/* Tail */
addLimb(monster, new THREE.ConeGeometry(0.06, 0.4, 5), M.skinD, new V3(0, 0.25, -0.35), new V3(0.5, 0, 0));
/* Spines on back */
for (let i = 0; i < 4; i++) {
  addLimb(monster, new THREE.ConeGeometry(0.025, 0.1, 4), M.horn, new V3(0, 0.95 + i * 0.07, -0.15 - i * 0.04), new V3(0.4, 0, 0));
}

monster.position.set(0, 0, -3);
monster.scale.set(1.2, 1.2, 1.2);
scene.add(monster);

/* ═══════ CONTROLS (third-person) ═══════ */
const orbitCtrl = new OrbitControls(camera, renderer.domElement);
orbitCtrl.target.copy(monster.position);
orbitCtrl.update();
camera.position.set(3, 3.5, 6);

const keys = {};
document.addEventListener('keydown', e => { const k = e.key.toLowerCase(); if ('wasd'.includes(k)) keys[k] = true; });
document.addEventListener('keyup', e => { const k = e.key.toLowerCase(); if ('wasd'.includes(k)) keys[k] = false; });

/* ═══════ DESTRUCTION ═══════ */
let score = 0;
const scoreEl = document.getElementById('scoreVal');
const destroyedEl = document.getElementById('destroyed');
const restartBtn = document.getElementById('restart');
let destroyedCount = 0;
const totalBuildings = buildingData.length;

const debrisList = [];
const debrisMat = new THREE.MeshStandardMaterial({ color: 0x8a7a6a, roughness: 0.8 });
let shakeIntensity = 0;

function smash() {
  let closest = null, closestDist = Infinity;
  const fp = monster.position.clone();
  fp.y = 0;
  for (const b of buildingData) {
    if (!b.alive) continue;
    const bp = new V3(b.x, 0, b.z);
    const dist = fp.distanceTo(bp);
    if (dist < closestDist && dist < 2.0) {
      closest = b;
      closestDist = dist;
    }
  }
  if (!closest) return;

  const bx = closest.x, bz = closest.z, bw = closest.w, bd = closest.d, bh = closest.h;
  const color = closest.mesh.material.color.getHex();

  closest.hp--;
  if (closest.hp > 0) {
    /* Hit but not destroyed — small debris burst */
    shakeIntensity = 0.03;
    for (let i = 0; i < 5; i++) {
      const size = rng(0.02, 0.05);
      const piece = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), debrisMat);
      piece.material = piece.material.clone();
      piece.material.color.setHex(color);
      piece.position.set(bx + rng(-bw/2, bw/2), bh * 0.5 + rng(0, bh * 0.2), bz + rng(-bd/2, bd/2));
      piece.userData.vel = new V3(rng(-1, 1), rng(0.5, 2), rng(-1, 1));
      piece.userData.life = rng(0.5, 1);
      scene.add(piece);
      debrisList.push(piece);
    }
    return;
  }

  /* Full destruction */
  closest.alive = false;
  closest.mesh.visible = false;
  shakeIntensity = 0.08;

  /* Ground debris mark */
  const mark = new THREE.Mesh(new THREE.BoxGeometry(bw * 0.9, 0.01, bd * 0.9),
    new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.95 }));
  mark.position.set(bx, 0.005, bz);
  scene.add(mark);

  /* Colored debris */
  const count = Math.floor(10 + bh * 8);
  for (let i = 0; i < count; i++) {
    const size = rng(0.03, 0.08);
    const piece = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), debrisMat);
    piece.material = piece.material.clone();
    piece.material.color.setHex(color);
    piece.position.set(bx + rng(-bw/2, bw/2), bh * 0.5 + rng(0, bh * 0.3), bz + rng(-bd/2, bd/2));
    piece.castShadow = true;
    piece.userData.vel = new V3(rng(-1.5, 1.5), rng(1.5, 4), rng(-1.5, 1.5));
    piece.userData.life = rng(1.5, 3);
    scene.add(piece);
    debrisList.push(piece);
  }

  /* Dust cloud */
  for (let i = 0; i < 6; i++) {
    const dust = new THREE.Mesh(new THREE.SphereGeometry(rng(0.05, 0.15), 4, 4),
      new THREE.MeshBasicMaterial({ color: 0xccbbaa, transparent: true, opacity: 0.3 }));
    dust.position.set(bx + rng(-0.3, 0.3), rng(0.2, bh * 0.5), bz + rng(-0.3, 0.3));
    dust.userData.vel = new V3(rng(-0.8, 0.8), rng(0.5, 1.5), rng(-0.8, 0.8));
    dust.userData.life = rng(0.5, 1.2);
    dust.userData.isDust = true;
    scene.add(dust);
    debrisList.push(dust);
  }

  destroyedCount++;
  score += Math.floor(100 + bh * 50);
  scoreEl.textContent = score;

  if (destroyedCount >= totalBuildings) {
    destroyedEl.textContent = `🎉 全部摧毁！得分: ${score}`;
    destroyedEl.style.display = 'block';
    restartBtn.style.display = 'block';
  }
}

/* ═══════ INPUT ═══════ */
renderer.domElement.addEventListener('click', () => {
  if (!orbitCtrl.enabled) return;
  /* Only smash if camera hasn't moved much (click ≠ drag) */
  smash();
});
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); smash(); }
});

restartBtn.addEventListener('click', () => {
  window.location.reload();
});

/* ═══════ ANIMATION ═══════ */
const clock = new THREE.Clock();
let walkPhase = 0;
const _fwd = new V3(), _rgt = new V3(), _mv = new V3();

document.getElementById('hint').style.opacity = '0';
setTimeout(() => { document.getElementById('controls').classList.remove('show'); }, 4000);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.getElapsedTime();

  /* Monster movement */
  _fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
  _fwd.y = 0; _fwd.normalize();
  _rgt.set(1, 0, 0).applyQuaternion(camera.quaternion);
  _rgt.y = 0; _rgt.normalize();
  _mv.set(0, 0, 0);
  if (keys.w) _mv.add(_fwd);
  if (keys.s) _mv.sub(_fwd);
  if (keys.a) _mv.sub(_rgt);
  if (keys.d) _mv.add(_rgt);

  const moving = _mv.length() > 0.01;
  if (moving) {
    _mv.normalize().multiplyScalar(3.5 * dt);
    const nx = monster.position.x + _mv.x;
    const nz = monster.position.z + _mv.z;

    /* Collision with buildings */
    let cx = true, cz = true;
    for (const b of buildingData) {
      if (!b.alive) continue;
      const r = 0.35;
      if (Math.abs(nx - b.x) < b.w / 2 + r && Math.abs(monster.position.z - b.z) < b.d / 2 + r) { cx = false; smash(); }
      if (Math.abs(monster.position.x - b.x) < b.w / 2 + r && Math.abs(nz - b.z) < b.d / 2 + r) { cz = false; smash(); }
    }
    if (cx) monster.position.x = nx;
    if (cz) monster.position.z = nz;
    monster.position.x = Math.max(-10, Math.min(10, monster.position.x));
    monster.position.z = Math.max(-10, Math.min(10, monster.position.z));

    /* Face movement direction */
    const targetAngle = Math.atan2(_mv.x, _mv.z);
    let currentAngle = monster.rotation.y;
    let diff = targetAngle - currentAngle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    monster.rotation.y += diff * dt * 8;

    /* Walk animation */
    walkPhase += dt * 6;
    const bob = Math.sin(walkPhase) * 0.04;
    monster.position.y = bob;
    const swing = Math.sin(walkPhase) * 0.2;
    lArm.rotation.x = swing;
    rArm.rotation.x = -swing;
    lLeg.rotation.x = -swing * 0.5;
    rLeg.rotation.x = swing * 0.5;
    head.position.y = 1.15 + bob * 0.5;
  } else {
    monster.position.y = 0;
    lArm.rotation.x = 0;
    rArm.rotation.x = 0;
    lLeg.rotation.x = 0;
    rLeg.rotation.x = 0;
    head.position.y = 1.15;
  }

  /* Camera follow */
  orbitCtrl.target.lerp(monster.position, dt * 4);

  /* Screen shake decay */
  if (shakeIntensity > 0) {
    camera.position.x += rng(-shakeIntensity, shakeIntensity);
    camera.position.y += rng(-shakeIntensity, shakeIntensity);
    shakeIntensity *= 0.92;
    if (shakeIntensity < 0.001) shakeIntensity = 0;
  }

  /* Debris physics */
  for (let i = debrisList.length - 1; i >= 0; i--) {
    const d = debrisList[i];
    d.userData.life -= dt;
    if (d.userData.life <= 0) {
      scene.remove(d);
      debrisList.splice(i, 1);
      continue;
    }
    if (d.userData.isDust) {
      d.userData.vel.y -= 2 * dt;
      d.material.opacity = 0.3 * (d.userData.life / 1.5);
    } else {
      d.userData.vel.y -= 5 * dt;
    }
    d.position.addScaledVector(d.userData.vel, dt);
    if (d.position.y < 0) {
      d.position.y = 0;
      d.userData.vel.y *= -0.2;
      d.userData.vel.x *= 0.8;
      d.userData.vel.z *= 0.8;
    }
    d.rotation.x += dt * 2;
    d.rotation.z += dt * 1.5;
  }

  /* Building destruction timeout auto-smash */
  if (destroyedCount < totalBuildings && Math.random() < 0.003) {
    const alive = buildingData.filter(b => b.alive);
    if (alive.length > 0) {
      /* Monster auto-smash nearby building for feel */
      const nearby = alive.filter(b => {
        const dx = b.x - monster.position.x, dz = b.z - monster.position.z;
        return Math.sqrt(dx * dx + dz * dz) < 2.5;
      });
      if (nearby.length > 0) {
        const target = nearby[Math.floor(Math.random() * nearby.length)];
        target.alive = false;
        target.mesh.visible = false;
        shakeIntensity = 0.05;
        const bx = target.x, bz = target.z, bw = target.w, bd = target.d, bh = target.h;
        const color = target.mesh.material.color.getHex();
        const mark = new THREE.Mesh(new THREE.BoxGeometry(bw * 0.9, 0.01, bd * 0.9),
          new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.95 }));
        mark.position.set(bx, 0.005, bz);
        scene.add(mark);
        const count = Math.floor(8 + bh * 6);
        for (let i = 0; i < count; i++) {
          const size = rng(0.03, 0.07);
          const piece = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), debrisMat);
          piece.material = piece.material.clone();
          piece.material.color.setHex(color);
          piece.position.set(bx + rng(-bw/2, bw/2), bh * 0.5 + rng(0, bh * 0.3), bz + rng(-bd/2, bd/2));
          piece.userData.vel = new V3(rng(-1, 1), rng(1, 3), rng(-1, 1));
          piece.userData.life = rng(1, 2.5);
          scene.add(piece);
          debrisList.push(piece);
        }
        destroyedCount++;
        score += Math.floor(80 + bh * 40);
        scoreEl.textContent = score;
        if (destroyedCount >= totalBuildings) {
          destroyedEl.textContent = `🎉 全部摧毁！得分: ${score}`;
          destroyedEl.style.display = 'block';
          restartBtn.style.display = 'block';
        }
      }
    }
  }

  orbitCtrl.update();
  renderer.render(scene, camera);
}

animate();

/* Resize */
window.addEventListener('resize', () => {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
</body>
</html>
