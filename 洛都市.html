<!DOCTYPE html>

<head>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

/* GLB loader — 取消注释即可加载 Blender 导出的模型 ↓
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
*/

function rng(a, b) { return a + Math.random() * (b - a); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

const V3 = THREE.Vector3;
const Q = THREE.Quaternion;
const M4 = THREE.Matrix4;

const scene = new THREE.Scene();

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.logarithmicDepthBuffer = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 300);
camera.position.set(5, 18, 28);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-2, 3, -3);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 55;
controls.maxPolarAngle = Math.PI / 2.15;
controls.update();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.12, 0.3, 0.1);
composer.addPass(bloom);
composer.addPass(new SMAAPass(innerWidth, innerHeight));

/* ═══════ SKY ═══════ */
const sky = new Sky();
sky.scale.setScalar(250);

const sunPos = new V3(-12, 3, -18);
const moonPos = new V3(8, 3, -2);

function updateSkyParams(t) {
  const unis = sky.material.uniforms;
  const turb = 2 + 6 * (1 - t);
  const rayleigh = 0.5 + 1.5 * (1 - t);
  const mie = 0.001 + 0.004 * (1 - t);
  unis.turbidity.value = turb;
  unis.rayleigh.value = rayleigh;
  unis.mieCoefficient.value = mie;
  unis.mieDirectionalG.value = 0.7;
  const sp = new V3().lerpVectors(sunPos, moonPos, t).normalize().multiplyScalar(12);
  unis.sunPosition.value.copy(sp);
}
sky.material.uniforms.sunPosition.value.copy(sunPos);
scene.add(sky);

/* ═══════ ENVIRONMENT MAP ═══════ */
const pmremGenerator = new THREE.PMREMGenerator(renderer);
const envMapRT = pmremGenerator.fromScene(scene, 0.04);
scene.environment = envMapRT.texture;

/* ═══════ LIGHTING ═══════ */
const sun = new THREE.DirectionalLight(0xff8844, 2.8);
sun.position.copy(sunPos);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 80;
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.bias = -0.003;
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0x88aacc, 0.25);
fillLight.position.set(5, 8, 10);
scene.add(fillLight);

const ambient = new THREE.AmbientLight(0xffccaa, 0.12);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0xffaa66, 0x446688, 0.25);
scene.add(hemi);

/* ═══════ GROUND ═══════ */
const groundGeo = new THREE.PlaneGeometry(120, 80);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.95 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

/* ═══════ MATERIALS ═══════ */
const M = {};
M.glass1 = new THREE.MeshPhysicalMaterial({ color: 0x2a4a6a, roughness: 0.15, metalness: 0.6, clearcoat: 0.15, clearcoatRoughness: 0.2 });

M.glass4 = new THREE.MeshPhysicalMaterial({ color: 0x5a7a6a, roughness: 0.2, metalness: 0.5, clearcoat: 0.1, clearcoatRoughness: 0.2 });
M.warm1 = new THREE.MeshStandardMaterial({ color: 0xc8b8a0, roughness: 0.6, metalness: 0.0 });
M.warm2 = new THREE.MeshStandardMaterial({ color: 0xd4c4a8, roughness: 0.55, metalness: 0.0 });
M.warm3 = new THREE.MeshStandardMaterial({ color: 0xb8a890, roughness: 0.65, metalness: 0.0 });
M.conc1 = new THREE.MeshStandardMaterial({ color: 0xa89880, roughness: 0.7, metalness: 0.0 });
M.conc2 = new THREE.MeshStandardMaterial({ color: 0x8a7a6a, roughness: 0.75, metalness: 0.0 });
M.conc3 = new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: 0.8, metalness: 0.0 });
M.dark  = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.7, metalness: 0.1 });
M.met   = new THREE.MeshStandardMaterial({ color: 0x6a6a6a, roughness: 0.3, metalness: 0.6 });
M.gold  = new THREE.MeshStandardMaterial({ color: 0xcc8833, roughness: 0.4, metalness: 0.3 });
M.palm  = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9, metalness: 0.0, side: THREE.DoubleSide });
M.road  = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9, metalness: 0.0 });
M.sand  = new THREE.MeshStandardMaterial({ color: 0xd4b888, roughness: 0.95, metalness: 0.0 });
M.mtn   = new THREE.MeshStandardMaterial({ color: 0x3a2a3a, roughness: 0.95, metalness: 0.0, flatShading: true });
M.mtnFog= new THREE.MeshStandardMaterial({ color: 0x5a4a5a, roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.5 });
M.lampGlow = new THREE.MeshBasicMaterial({ color: 0xffdd88, transparent: true, opacity: 0.7, depthWrite: false });
M.carCabin = new THREE.MeshStandardMaterial({ color: 0x88aacc, roughness: 0.1, metalness: 0.1 });
M.winGlow  = new THREE.MeshBasicMaterial({ color: 0xffcc88, transparent: true, opacity: 0.1, depthWrite: false });
M.winGlowN = new THREE.MeshBasicMaterial({ color: 0xffcc88, transparent: true, opacity: 0.35, depthWrite: false });

const glassMats = [M.glass1, M.glass2, M.glass3, M.glass4];
const warmMats  = [M.warm1, M.warm2, M.warm3];
const concMats  = [M.conc1, M.conc2, M.conc3];

/* ═══════ MOUNTAINS (InstancedMesh) ═══════ */
const mtnGeo = new THREE.ConeGeometry(1, 1, 6);

function makeInstanced(count, geo, mat) {
  const im = new THREE.InstancedMesh(geo, mat, count);
  im.castShadow = true;
  im.receiveShadow = true;
  return im;
}

const dummy = new THREE.Object3D();
const _v = new V3();
const _q = new Q();

const mtnData = [];
for (let i = 0; i < 30; i++) {
  mtnData.push({
    x: rng(-30, -3), z: rng(-32, -22),
    w: rng(3, 8), h: rng(2, 7)
  });
}
const mtnIM = makeInstanced(mtnData.length, mtnGeo, M.mtn);
mtnData.forEach((d, i) => {
  const s = 1 + d.h * 0.08;
  dummy.position.set(d.x, -d.h * 0.5, d.z);
  dummy.scale.set(d.w, d.h, d.w);
  dummy.updateMatrix();
  mtnIM.setMatrixAt(i, dummy.matrix);
});
mtnIM.castShadow = true;
mtnIM.receiveShadow = true;
mtnIM.instanceMatrix.needsUpdate = true;
scene.add(mtnIM);

/* ═══════ WATER ═══════ */
let water, waterAnimate = false;
const texLoader = new THREE.TextureLoader();
texLoader.load(
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/textures/waternormals.jpg',
  (tex) => {
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    const waterGeo = new THREE.PlaneGeometry(40, 30);
    water = new Water(waterGeo, {
      textureWidth: 512,
      textureHeight: 512,
      waterNormals: tex,
      sunDirection: sunPos.clone(),
      sunColor: 0xff8844,
      waterColor: 0x1a3555,
      distortionScale: 2.5,
      fog: false,
    });
    water.rotation.x = -Math.PI / 2;
    water.position.set(15, 0.01, -10);
    water.receiveShadow = true;
    scene.add(water);
    waterAnimate = true;
    document.getElementById('loading').style.opacity = '0';
  },
  undefined,
  () => {
    const fallbackGeo = new THREE.PlaneGeometry(40, 30);
    const fallbackMat = new THREE.MeshStandardMaterial({ color: 0x1a3555, roughness: 0.05, metalness: 0.5 });
    water = new THREE.Mesh(fallbackGeo, fallbackMat);
    water.rotation.x = -Math.PI / 2;
    water.position.set(15, 0.01, -10);
    water.receiveShadow = true;
    scene.add(water);
    waterAnimate = true;
    document.getElementById('loading').style.opacity = '0';
  }
);

const beach = new THREE.Mesh(new THREE.PlaneGeometry(6, 14), M.sand);
beach.rotation.x = -Math.PI / 2;
beach.position.set(10, 0.015, -5);
scene.add(beach);

/* ═══════ BUILDINGS — grid layout + collision-free + podium/tower variety ═══════ */
const bodyGeo = new THREE.BoxGeometry(1, 1, 1);

/* ── Collision checker ── */
const placed = [];
function overlaps(x, z, w, d) {
  return placed.some(b =>
    Math.abs(b.x - x) < (b.w + w) / 2 + 0.08 &&
    Math.abs(b.z - z) < (b.d + d) / 2 + 0.08
  );
}
function place(x, z, w, d, h, m, type) {
  const rec = { x, z, w, d, h, m, type: type || 'box' };
  placed.push(rec);
  return rec;
}

/* ── Downtown core (dense skyscraper cluster, grid-aligned) ── */
// Grid: z rows (north→south), x cols (east→west)
// Row 0-1 (z≈-11~-9): shorter, wider
// Row 2-3 (z≈-8~-6): medium height, main cluster  
// Row 4   (z≈-4.5):  tallest skyline peak
// Row 5   (z≈-3):    medium-back edge

const dSpecs = [
  // [x, z, w, d, h, matKey, type]
  // Back edge row (z≈-11)
  [-7.5, -11.0, 0.7, 0.6, 1.6, 'c2', 'box'],
  [-5.8, -11.0, 0.9, 0.6, 2.0, 'w1', 'box'],
  [-4.2, -11.0, 0.7, 0.6, 1.8, 'c3', 'box'],
  [-2.5, -11.0, 1.0, 0.6, 1.8, 'w2', 'wide'],
  [-0.8, -11.0, 0.8, 0.6, 2.2, 'w3', 'box'],
  [1.0,  -11.0, 0.7, 0.6, 1.5, 'c1', 'box'],

  // Mid core row (z≈-9)
  [-7.0, -9.2, 0.9, 0.7, 2.5, 'c1', 'box'],
  [-5.2, -9.2, 1.0, 0.8, 3.2, 'g3', 'podium'],
  [-3.5, -9.3, 0.8, 0.7, 2.8, 'w1', 'box'],
  [-1.8, -9.2, 0.9, 0.8, 3.5, 'g4', 'podium'],
  [0.0,  -9.3, 0.7, 0.7, 2.4, 'c2', 'box'],
  [1.6,  -9.2, 0.8, 0.7, 2.2, 'w3', 'box'],

  // Main cluster row (z≈-7.5)
  [-6.8, -7.6, 1.0, 0.8, 3.6, 'g2', 'podium'],
  [-5.0, -7.5, 0.9, 0.7, 3.8, 'g3', 'tower'],
  [-3.2, -7.6, 1.0, 0.9, 4.5, 'g1', 'podium'],
  [-1.3, -7.5, 0.8, 0.7, 3.2, 'g4', 'box'],
  [0.5,  -7.6, 1.1, 0.8, 4.0, 'g2', 'tower'],
  [2.0,  -7.5, 0.7, 0.7, 2.8, 'w2', 'box'],

  // Skyline peak row (z≈-5.5)
  [-6.2, -5.6, 1.1, 0.9, 4.2, 'g1', 'tower'],
  [-4.3, -5.5, 1.0, 1.0, 4.8, 'g2', 'podium'],
  [-2.5, -5.6, 0.9, 0.8, 5.0, 'g3', 'tower'],
  [-0.8, -5.5, 1.2, 0.9, 4.5, 'g1', 'podium'],
  [1.2,  -5.6, 0.8, 0.8, 3.5, 'g4', 'tower'],

  // Near-roof row (z≈-3.5)
  [-5.5, -3.6, 1.0, 0.8, 3.0, 'g2', 'box'],
  [-3.6, -3.5, 0.9, 0.7, 3.4, 'g3', 'podium'],
  [-1.8, -3.6, 0.8, 0.8, 2.8, 'w1', 'box'],
  [0.0,  -3.5, 1.0, 0.8, 2.6, 'g4', 'box'],
  [1.5,  -3.6, 0.7, 0.7, 2.2, 'c3', 'box'],
];

const downtownData = dSpecs.map(s => place(s[0], s[1], s[2], s[3], s[4], matLookup[s[5]], s[6]));

/* ── Midtown (buffer zone, spread evenly, smaller) ── */
const mSpecs = [
  // z≈-1.5 row
  [-8.0, -1.5, 0.8, 0.6, 1.6, M.warm1, 'box'],
  [-6.2, -1.5, 0.7, 0.6, 2.0, M.conc1, 'box'],
  [-4.4, -1.5, 0.9, 0.7, 1.8, M.warm2, 'box'],
  [-2.6, -1.5, 0.7, 0.6, 2.2, M.conc2, 'box'],
  [-0.8, -1.5, 0.8, 0.6, 1.6, M.warm3, 'box'],
  [1.0,  -1.5, 0.7, 0.6, 1.8, M.conc3, 'box'],
  [2.5,  -1.5, 0.8, 0.6, 1.5, M.warm1, 'box'],

  // z≈0.5 row
  [-7.5, 0.5, 0.7, 0.6, 1.5, M.conc2, 'box'],
  [-5.5, 0.5, 0.8, 0.6, 1.8, M.warm2, 'box'],
  [-3.5, 0.5, 0.7, 0.7, 1.6, M.conc1, 'box'],
  [-1.5, 0.5, 0.9, 0.7, 2.0, M.warm3, 'box'],
  [0.5,  0.5, 0.7, 0.6, 1.8, M.conc3, 'box'],
  [2.2,  0.5, 0.8, 0.6, 1.5, M.warm1, 'box'],

  // z≈2.5 row
  [-6.8, 2.5, 0.7, 0.6, 1.4, M.conc1, 'box'],
  [-5.0, 2.5, 0.8, 0.6, 1.8, M.conc3, 'box'],
  [-3.0, 2.5, 0.7, 0.6, 1.5, M.warm2, 'box'],
  [-1.0, 2.5, 0.8, 0.6, 1.6, M.warm1, 'box'],
  [1.0,  2.5, 0.7, 0.6, 1.4, M.conc2, 'box'],
  [2.8,  2.5, 0.8, 0.6, 1.5, M.warm3, 'box'],

  // z≈4.5 row
  [-8.0, 4.5, 0.7, 0.6, 1.2, M.conc2, 'box'],
  [-5.8, 4.5, 0.8, 0.6, 1.5, M.warm1, 'box'],
  [-3.6, 4.5, 0.7, 0.6, 1.6, M.conc1, 'box'],
  [-1.4, 4.5, 0.8, 0.6, 1.4, M.warm2, 'box'],
  [0.8,  4.5, 0.7, 0.6, 1.5, M.conc3, 'box'],
  [2.6,  4.5, 0.8, 0.6, 1.2, M.warm3, 'box'],
  [3.8,  4.5, 0.7, 0.6, 1.3, M.conc1, 'box'],

  // z≈6.5 edge row
  [-7.0, 6.5, 0.7, 0.6, 1.0, M.warm3, 'box'],
  [-5.0, 6.5, 0.8, 0.6, 1.2, M.conc2, 'box'],
  [-3.0, 6.5, 0.7, 0.6, 1.1, M.warm1, 'box'],
  [-1.0, 6.5, 0.8, 0.6, 1.0, M.conc1, 'box'],
  [1.0,  6.5, 0.7, 0.6, 1.2, M.warm2, 'box'],
  [2.5,  6.5, 0.8, 0.6, 1.0, M.conc3, 'box'],
];
const mtownData = mSpecs.map(s => place(s[0], s[1], s[2], s[3], s[4], s[5], s[6]));

/* ── Sea-side buildings (coastal strip, lowest) ── */
const seaSpecs = [
  [9.0, -6.0, 0.6, 0.5, 0.8, M.conc2, 'box'],
  [9.0, -4.0, 0.6, 0.5, 1.0, M.warm1, 'box'],
  [9.0, -2.0, 0.6, 0.5, 0.9, M.conc1, 'box'],
  [9.0, 0.0, 0.6, 0.5, 1.1, M.warm2, 'box'],
  [9.0, 2.0, 0.6, 0.5, 0.8, M.conc3, 'box'],
];
seaSpecs.forEach(s => place(s[0], s[1], s[2], s[3], s[4], s[5], s[6]));

const allBuildings = placed.slice();

/* ── Body InstancedMeshes per material ── */
const bodyGroups = {};
allBuildings.forEach(d => {
  const k = d.m.uuid;
  if (!bodyGroups[k]) bodyGroups[k] = { m: d.m, data: [] };
  bodyGroups[k].data.push(d);
});
for (const [k, g] of Object.entries(bodyGroups)) {
  const im = makeInstanced(g.data.length, bodyGeo, g.m);
  g.data.forEach((d, i) => {
    dummy.position.set(d.x, d.h / 2, d.z);
    dummy.scale.set(d.w, d.h, d.d);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = true;
  im.receiveShadow = true;
  scene.add(im);
}

/* ── Podiums (wider base for podium/tower types) ── */
const podiumGeo = new THREE.BoxGeometry(1, 1, 1);
const podiumData = [];
allBuildings.forEach(d => {
  if (d.type === 'podium' || d.type === 'tower') {
    const pw = d.w * 1.4, pd = d.d * 1.4, ph = d.h * 0.16;
    podiumData.push({ x: d.x, z: d.z, w: pw, h: ph, d: pd, m: M.conc2 });
  }
});
const podiumGroups = {};
podiumData.forEach(d => {
  const k = d.m.uuid;
  if (!podiumGroups[k]) podiumGroups[k] = { m: d.m, data: [] };
  podiumGroups[k].data.push(d);
});
for (const [k, g] of Object.entries(podiumGroups)) {
  const im = makeInstanced(g.data.length, podiumGeo, g.m);
  g.data.forEach((d, i) => {
    dummy.position.set(d.x, d.h / 2, d.z);
    dummy.scale.set(d.w, d.h, d.d);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = true;
  im.receiveShadow = true;
  scene.add(im);
}

/* ── Setback crowns (narrower top section for tower type) ── */
const crownGeo = new THREE.BoxGeometry(1, 1, 1);
const crownData = [];
allBuildings.forEach(d => {
  if (d.type === 'tower') {
    const ch = d.h * 0.12, cw = d.w * 0.65, cd = d.d * 0.65;
    crownData.push({ x: d.x, z: d.z, w: cw, h: ch, d: cd, y: d.h + ch / 2, m: M.conc1 });
  }
});
const crownGroups = {};
crownData.forEach(d => {
  const k = d.m.uuid;
  if (!crownGroups[k]) crownGroups[k] = { m: d.m, data: [] };
  crownGroups[k].data.push(d);
});
for (const [k, g] of Object.entries(crownGroups)) {
  const im = makeInstanced(g.data.length, crownGeo, g.m);
  g.data.forEach((d, i) => {
    dummy.position.set(d.x, d.y, d.z);
    dummy.scale.set(d.w, d.h, d.d);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = true;
  scene.add(im);
}

/* ── Floor bands (InstancedMesh, horizontal strips on facades) ── */
const bandGeo = new THREE.BoxGeometry(1, 0.01, 0.012);
const bandData = [];
allBuildings.forEach(d => {
  if (d.h < 1.2) return;
  const floors = Math.floor(d.h / 0.24);
  for (let f = 1; f < floors; f++) {
    const fy = f * 0.24;
    bandData.push({ x: d.x, y: fy, z: d.z + d.d / 2, w: d.w + 0.002 });
    bandData.push({ x: d.x, y: fy, z: d.z - d.d / 2, w: d.w + 0.002 });
  }
});
const bandIM = makeInstanced(bandData.length, bandGeo, M.met);
bandData.forEach((d, i) => {
  dummy.position.set(d.x, d.y, d.z);
  dummy.scale.set(d.w, 1, 1);
  dummy.updateMatrix();
  bandIM.setMatrixAt(i, dummy.matrix);
});
bandIM.instanceMatrix.needsUpdate = true;
bandIM.receiveShadow = true;
scene.add(bandIM);

/* ── Corner pillars for tall downtown ── */
const pillarGeo = new THREE.CylinderGeometry(0.012, 0.015, 1, 5);
const pillarData = [];
allBuildings.forEach(d => {
  if (d.h < 2.0) return;
  const ps = [[d.w/2, d.d/2], [-d.w/2, d.d/2], [d.w/2, -d.d/2], [-d.w/2, -d.d/2]];
  ps.forEach(([px, pz]) => {
    pillarData.push({ x: d.x + px * 0.88, z: d.z + pz * 0.88, h: d.h });
  });
});
const pillarIM = makeInstanced(pillarData.length, pillarGeo, M.conc1);
pillarData.forEach((d, i) => {
  dummy.position.set(d.x, d.h / 2, d.z);
  dummy.scale.set(1, d.h, 1);
  dummy.updateMatrix();
  pillarIM.setMatrixAt(i, dummy.matrix);
});
pillarIM.instanceMatrix.needsUpdate = true;
pillarIM.castShadow = true;
scene.add(pillarIM);

/* ── Roof equipment (InstancedMesh) ── */
const pentGeo = new THREE.BoxGeometry(1, 0.12, 1);
const acGeo = new THREE.BoxGeometry(0.06, 0.04, 0.07);
const tankGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.12, 6);
const antGeo = new THREE.CylinderGeometry(0.004, 0.008, 1, 4);

const pentData = [], acData = [], tankData = [], antData = [];
allBuildings.forEach(d => {
  if (d.h < 2.0) return;
  pentData.push({ x: d.x + d.w * 0.08, y: d.h + 0.06, z: d.z, w: d.w * 0.1, d: d.d * 0.1 });
  for (let a = 0; a < Math.floor(rng(1, 4)); a++) {
    acData.push({ x: d.x + rng(-d.w * 0.25, d.w * 0.25), y: d.h + 0.02, z: d.z + rng(-d.d * 0.25, d.d * 0.25), rot: rng(0, Math.PI) });
  }
  if (d.h > 3.5) {
    tankData.push({ x: d.x - d.w * 0.12, y: d.h + 0.06, z: d.z - d.d * 0.12 });
    antData.push({ x: d.x + d.w * 0.12, y: d.h + d.h * 0.05, z: d.z, h: d.h * 0.1 });
  }
});
[pentData, acData, tankData, antData].forEach((arr, idx) => {
  if (!arr.length) return;
  const g = [pentGeo, acGeo, tankGeo, antGeo][idx];
  const m = [M.conc2, M.met, M.met, M.met][idx];
  const im = makeInstanced(arr.length, g, m);
  arr.forEach((d, i) => {
    dummy.position.set(d.x, d.y, d.z);
    if (idx === 0) dummy.scale.set(d.w, 1, d.d);
    else if (idx === 3) dummy.scale.set(1, d.h, 1);
    else dummy.scale.set(1, 1, 1);
    if (idx === 1) dummy.rotation.set(0, d.rot, 0);
    else dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
  });
  im.instanceMatrix.needsUpdate = true;
  scene.add(im);
});

/* ── Ground-floor shop glazing (InstancedMesh) ── */
const shopData = [];
allBuildings.forEach((d, i) => {
  if (i % 3 !== 0) return;
  shopData.push({ x: d.x, y: 0.16, z: d.z + d.d / 2 + 0.003, w: d.w * 0.65 });
});
if (shopData.length) {
  const shopGeo = new THREE.PlaneGeometry(1, 0.18);
  const im = makeInstanced(shopData.length, shopGeo, M.winGlow);
  im.renderOrder = 1;
  shopData.forEach((d, i) => {
    dummy.position.set(d.x, d.y, d.z);
    dummy.scale.set(d.w, 1, 1);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
  });
  im.instanceMatrix.needsUpdate = true;
  scene.add(im);
}

/* ── Window glow on facades (InstancedMesh, 1 shared plane geometry) ── */
const glowData = [];
allBuildings.forEach(d => {
  if (d.h < 1.8) return;
  glowData.push({ x: d.x, y: d.h / 2, z: d.z + d.d / 2 + 0.004, w: d.w * 0.8, h: d.h * 0.5, r: 0 });
  glowData.push({ x: d.x, y: d.h / 2, z: d.z - d.d / 2 - 0.004, w: d.w * 0.8, h: d.h * 0.5, r: Math.PI });
});
if (glowData.length) {
  const glowGeo = new THREE.PlaneGeometry(1, 1);
  const im = makeInstanced(glowData.length, glowGeo, M.winGlow);
  im.renderOrder = 1;
  glowData.forEach((d, i) => {
    dummy.position.set(d.x, d.y, d.z);
    dummy.scale.set(d.w, d.h, 1);
    if (d.r) dummy.rotation.set(0, d.r, 0);
    else dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
  });
  im.instanceMatrix.needsUpdate = true;
  scene.add(im);
}

/* ── Sidewalks ── */
const swGeo = new THREE.BoxGeometry(0.35, 0.012, 0.8);
const swData = [];
for (let si = -4; si <= 6; si++) { swData.push({ x: si * 0.5 + 0.5, z: 6.3 }); }
for (let si = -6; si <= 6; si++) { swData.push({ x: si * 0.3, z: 13.5 }); }
const swIM = makeInstanced(swData.length, swGeo, M.conc2);
swData.forEach((d, i) => {
  dummy.position.set(d.x, 0.008, d.z);
  dummy.scale.set(1, 1, 1);
  dummy.updateMatrix();
  swIM.setMatrixAt(i, dummy.matrix);
});
swIM.instanceMatrix.needsUpdate = true;
swIM.receiveShadow = true;
scene.add(swIM);

/* ═══════ HIGHWAY (InstancedMesh) ═══════ */
const hwGeo = new THREE.BoxGeometry(0.25, 0.02, 0.8);
const hwCount = 14;
const hwIM = makeInstanced(hwCount, hwGeo, M.road);
const hwData = [];
for (let hi = 0; hi < hwCount; hi++) {
  hwData.push({ x: hi * 0.5 - 3, z: 8 + Math.sin(hi * 0.3) * 2 });
}
hwData.forEach((d, i) => {
  dummy.position.set(d.x, 0.05, d.z);
  dummy.scale.set(1, 1, 1);
  dummy.updateMatrix();
  hwIM.setMatrixAt(i, dummy.matrix);
});
hwIM.instanceMatrix.needsUpdate = true;
hwIM.receiveShadow = true;
scene.add(hwIM);

/* ── Overpass pillars ── */
const pillarGeo = new THREE.CylinderGeometry(0.015, 0.02, 0.2, 4);
const overGeo = new THREE.BoxGeometry(0.1, 0.08, 0.6);
for (let hi = 0; hi < 8; hi++) {
  const ox = rng(-5, 3), oz = rng(5, 11);
  const over = new THREE.Mesh(overGeo, M.conc2);
  over.position.set(ox, 0.15, oz);
  scene.add(over);
  for (let pi = 0; pi < 2; pi++) {
    const pillar = new THREE.Mesh(pillarGeo, M.conc3);
    pillar.position.set(ox + (pi - 0.5) * 0.35, 0.08, oz);
    scene.add(pillar);
  }
}

/* ═══════ STREET LAMPS (InstancedMesh) ═══════ */
const lampGeo = new THREE.CylinderGeometry(0.008, 0.012, 0.2, 4);
const lampCount = 30;
const lampIM = makeInstanced(lampCount, lampGeo, M.dark);
const lampData = [];
for (let li = 0; li < lampCount; li++) {
  lampData.push({ x: rng(-6, 5), z: rng(5, 12), glow: Math.random() > 0.4 });
}
lampData.forEach((d, i) => {
  dummy.position.set(d.x, 0.1, d.z);
  dummy.scale.set(1, 1, 1);
  dummy.updateMatrix();
  lampIM.setMatrixAt(i, dummy.matrix);
});
lampIM.instanceMatrix.needsUpdate = true;
scene.add(lampIM);

/* Lamp glow lights */
const lampGlowGeo = new THREE.SphereGeometry(0.012, 4, 4);
lampData.forEach(d => {
  if (!d.glow) return;
  const gl = new THREE.Mesh(lampGlowGeo, M.lampGlow);
  gl.position.set(d.x, 0.19, d.z);
  gl.renderOrder = 2;
  scene.add(gl);
});

/* ═══════ PALM TREES (InstancedMesh for components) ═══════ */
const palmTrunkGeo = new THREE.CylinderGeometry(0.03, 0.06, 1, 6);
const palmFrondGeo = new THREE.PlaneGeometry(0.35, 0.025);

const palmData = [];
for (let pi = 0; pi < 25; pi++) {
  palmData.push({ x: rng(-8, 6), z: rng(7, 16), h: rng(1.8, 3.2) });
}
for (let pi = 0; pi < 8; pi++) {
  palmData.push({ x: rng(-3, 5), z: rng(-4, 3), h: rng(1.2, 2.0) });
}

const trunkIM = makeInstanced(palmData.length, palmTrunkGeo, M.palm);
palmData.forEach((d, i) => {
  dummy.position.set(d.x, d.h / 2, d.z);
  dummy.scale.set(1, d.h, 1);
  dummy.rotation.z = rng(-0.06, 0.06);
  dummy.rotation.y = Math.random() * Math.PI * 2;
  dummy.updateMatrix();
  trunkIM.setMatrixAt(i, dummy.matrix);
});
trunkIM.instanceMatrix.needsUpdate = true;
scene.add(trunkIM);

/* Fronds as individual meshes (since they need complex transforms per frond) */
palmData.forEach(d => {
  const fCount = 10;
  for (let f = 0; f < fCount; f++) {
    const angle = (f / fCount) * Math.PI * 2 + rng(-0.1, 0.1);
    for (let s = 0; s < 3; s++) {
      const frd = new THREE.Mesh(palmFrondGeo, M.palm);
      frd.position.set(
        d.x + Math.cos(angle) * (0.15 + s * 0.12),
        d.h - 0.03 + s * 0.04,
        d.z + Math.sin(angle) * (0.15 + s * 0.12)
      );
      frd.rotation.set(Math.PI / 2.5 + s * 0.15, angle + rng(-0.1, 0.1), rng(-0.2, 0.2));
      scene.add(frd);
    }
  }
});

/* ═══════ FRONT ROAD (InstancedMesh) ═══════ */
const frGeo = new THREE.BoxGeometry(0.15, 0.015, 0.5);
const frCount = 24;
const frIM = makeInstanced(frCount, frGeo, M.road);
const frData = [];
for (let fi = 0; fi < frCount; fi++) {
  frData.push({ x: fi * 0.3 - 3.5, z: 15 + Math.sin(fi * 0.5) * 0.8 });
}
frData.forEach((d, i) => {
  dummy.position.set(d.x, 0.015, d.z);
  dummy.scale.set(1, 1, 1);
  dummy.updateMatrix();
  frIM.setMatrixAt(i, dummy.matrix);
});
frIM.instanceMatrix.needsUpdate = true;
frIM.receiveShadow = true;
scene.add(frIM);

/* ═══════ CARS (InstancedMesh per color) ═══════ */
const carBodyGeo = new THREE.BoxGeometry(0.18, 0.04, 0.09);
const carCabinGeo = new THREE.BoxGeometry(0.1, 0.025, 0.07);
const carHLGeo = new THREE.SphereGeometry(0.008, 4, 4);

const carColors = [0xcc2222, 0x2244cc, 0xeeeeee, 0x222222, 0x22aa44, 0xffcc00, 0xcc44cc, 0x888888];
const carsByColor = {};
carColors.forEach(c => { carsByColor[c] = []; });

const carData = [];
for (let ci = 0; ci < 18; ci++) {
  const side = ci % 2 === 0 ? 1 : -1;
  const color = pick(carColors);
  carData.push({
    x: rng(-3, 4) + side * 0.2,
    z: 7.5 + rng(0, 3),
    color, side,
    speed: rng(0.008, 0.025),
  });
}

carData.forEach(d => {
  carsByColor[d.color].push({ x: d.x, y: 0.04, z: d.z, rotY: d.side * rng(0.8, 1.2) });
});

const carBodIMs = [];
for (const [color, data] of Object.entries(carsByColor)) {
  if (!data.length) continue;
  const mat = new THREE.MeshStandardMaterial({ color: parseInt(color), roughness: 0.3, metalness: 0.5 });
  const im = makeInstanced(data.length, carBodyGeo, mat);
  data.forEach((d, i) => {
    dummy.position.set(d.x, d.y + 0.03, d.z);
    dummy.rotation.set(0, d.rotY, 0);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
  });
  im.instanceMatrix.needsUpdate = true;
  scene.add(im);
  carBodIMs.push(im);
}

/* Car cabins (InstancedMesh) */
const cabinData = carData.map(d => ({
  x: d.x, z: d.z, rotY: d.side * rng(0.8, 1.2), side: d.side, speed: d.speed,
}));
const cabinIM = makeInstanced(cabinData.length, carCabinGeo, M.carCabin);
cabinData.forEach((d, i) => {
  dummy.position.set(d.x, 0.06, d.z);
  dummy.rotation.set(0, d.rotY, 0);
  dummy.scale.set(1, 1, 1);
  dummy.updateMatrix();
  cabinIM.setMatrixAt(i, dummy.matrix);
});
cabinIM.instanceMatrix.needsUpdate = true;
scene.add(cabinIM);

/* Car headlights (individual for glow + animation) */
const carLights = [];
carData.forEach(d => {
  for (let si = -1; si <= 1; si += 2) {
    const hl = new THREE.Mesh(carHLGeo, M.lampGlow);
    hl.position.set(d.x + 0.09 * d.side, 0.04, d.z + si * 0.04);
    hl.renderOrder = 2;
    scene.add(hl);
    carLights.push({ mesh: hl, baseX: d.x, baseZ: d.z, side: d.side, speed: d.speed, zOff: si * 0.04 });
  }
});

/* ═══════ CITY GLOW LAYER ═══════ */
const cityGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 20),
  new THREE.MeshBasicMaterial({ color: 0xff8844, transparent: true, opacity: 0.04, side: THREE.DoubleSide, depthWrite: false })
);
cityGlow.rotation.x = -Math.PI / 2;
cityGlow.position.set(-3, 0.1, -4);
cityGlow.renderOrder = 0;
scene.add(cityGlow);

/* ═══════ RAIN SYSTEM ═══════ */
const rainCount = 3000;
const rainGeo = new THREE.BufferGeometry();
const rainPositions = new Float32Array(rainCount * 3);
for (let i = 0; i < rainCount * 3; i += 3) {
  rainPositions[i] = rng(-20, 25);
  rainPositions[i + 1] = rng(0, 20);
  rainPositions[i + 2] = rng(-20, 20);
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
const rainMat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.03, transparent: true, opacity: 0.3, depthWrite: false });
const rainSystem = new THREE.Points(rainGeo, rainMat);
rainSystem.visible = false;
scene.add(rainSystem);

/* ═══════ STATE ═══════ */
const state = {
  isNight: false,
  weather: 0,
  targetNight: 0,
  currentNight: 0,
  envDirty: false,
};
const weatherLabels = ['☀ 晴', '🌧 雨', '🌫 雾'];

function regenEnv() {
  scene.environment = pmremGenerator.fromScene(scene, 0.04).texture;
  state.envDirty = false;
}

/* ═══════ UI ═══════ */
const btnMode = document.getElementById('btn-mode');
const btnRain = document.getElementById('btn-rain');

btnMode.addEventListener('click', () => {
  state.isNight = !state.isNight;
  state.targetNight = state.isNight ? 1 : 0;
  state.envDirty = true;
  btnMode.textContent = state.isNight ? '🌃 夜景 / 日落' : '🌅 日落 / 夜景';
});

btnRain.addEventListener('click', () => {
  state.weather = (state.weather + 1) % 3;
  state.envDirty = true;
  btnRain.textContent = weatherLabels[state.weather];
  btnRain.classList.toggle('active', state.weather > 0);
  rainSystem.visible = state.weather === 1;
});

/* ═══════ ANIMATION ═══════ */
const clock = new THREE.Clock();

/* Precompute car → InstancedMesh index mapping */
const carBodMap = []; // [{ im, localIdx }]
carData.forEach(d => {
  const colorData = carsByColor[d.color];
  const localIdx = colorData.findIndex(cd => Math.abs(cd.x - d.x) < 0.01);
  const im = carBodIMs.find(m => m.material.color.getHex() === d.color);
  carBodMap.push({ im, idx: Math.max(0, localIdx) });
});

const cabinMatrices = new Float32Array(cabinData.length * 16);

function updateCars() {
  /* Cabins */
  carData.forEach((d, i) => {
    const off = i * 16;
    const cos = Math.cos(d.side * 0.9), sin = Math.sin(d.side * 0.9);
    cabinMatrices[off + 0] = cos;  cabinMatrices[off + 1] = 0;  cabinMatrices[off + 2] = sin;  cabinMatrices[off + 3] = 0;
    cabinMatrices[off + 4] = 0;    cabinMatrices[off + 5] = 1;  cabinMatrices[off + 6] = 0;    cabinMatrices[off + 7] = 0;
    cabinMatrices[off + 8] = -sin; cabinMatrices[off + 9] = 0;  cabinMatrices[off + 10] = cos; cabinMatrices[off + 11] = 0;
    cabinMatrices[off + 12] = d.x; cabinMatrices[off + 13] = 0.06; cabinMatrices[off + 14] = d.z; cabinMatrices[off + 15] = 1;
  });
  cabinIM.instanceMatrix.copyArray(cabinMatrices);
  cabinIM.instanceMatrix.needsUpdate = true;

  /* Bodies (grouped by color IM) */
  carBodIMs.forEach(im => { im.instanceMatrix.needsUpdate = true; });
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.getElapsedTime();

  /* Smooth day/night transition */
  state.currentNight += (state.targetNight - state.currentNight) * dt * 2;
  const nt = state.currentNight;

  /* Sky */
  updateSkyParams(nt);

  /* Lighting */
  const nightMix = nt;
  sun.color.setRGB(
    1 - nightMix * 0.8,
    0.53 - nightMix * 0.4,
    0.27 - nightMix * 0.2
  );
  sun.intensity = 2.8 * (1 - nightMix * 0.9);
  ambient.color.setRGB(
    1 - nightMix * 0.9,
    0.8 - nightMix * 0.6,
    0.67 - nightMix * 0.5
  );
  ambient.intensity = 0.12 + nightMix * 0.05;
  fillLight.intensity = 0.25 * (1 - nightMix * 0.7);
  hemi.intensity = 0.25 * (1 - nightMix * 0.5);

  /* Bloom */
  bloom.strength = 0.12 + nightMix * 0.15;

  /* Window glow */
  M.winGlow.opacity = 0.1 + nightMix * 0.25;

  /* City glow layer */
  cityGlow.material.opacity = 0.04 + nightMix * 0.06;

  /* Sun position lerp */
  const sp = new V3().lerpVectors(sunPos, moonPos, nt);
  sun.position.copy(sp);
  if (waterAnimate && water && water.material.uniforms) {
    water.material.uniforms.sunDirection.value.copy(sp.normalize());
    water.material.uniforms.sunColor.value.setRGB(
      1 - nightMix * 0.8,
      0.45 - nightMix * 0.35,
      0.2
    );
  }

  /* Water animation */
  if (waterAnimate && water && water.material.uniforms) {
    water.material.uniforms.time.value += dt;
  }

  /* Cars */
  carData.forEach((d, i) => {
    d.x += d.side * d.speed;
    if (Math.abs(d.x) > 6) { d.side *= -1; }
    d.z += Math.sin(t * 0.5 + d.x) * 0.001;
  });
  updateCars();

  /* Env map regeneration (batched, not every frame) */
  if (state.envDirty && Math.abs(state.currentNight - state.targetNight) < 0.02) {
    regenEnv();
  }

  /* Car lights update */
  carLights.forEach((cl, i) => {
    const cd = carData[Math.floor(i / 2)];
    if (!cd) return;
    cl.mesh.position.set(cd.x + 0.09 * cd.side, 0.04, cd.z + cl.zOff);
    cl.mesh.material.opacity = 0.7 + Math.sin(t * 10 + i) * 0.2;
  });

  /* Rain */
  if (state.weather === 1) {
    const pos = rainGeo.attributes.position.array;
    for (let i = 0; i < rainCount * 3; i += 3) {
      pos[i + 1] -= dt * rng(3, 8);
      if (pos[i + 1] < -1) {
        pos[i + 1] = 20;
        pos[i] = rng(-20, 25);
        pos[i + 2] = rng(-20, 20);
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  /* Fog */
  if (state.weather === 2) {
    scene.fog = new THREE.FogExp2(0xccbba0, 0.005);
  } else if (state.weather === 1) {
    scene.fog = new THREE.FogExp2(0x8899bb, 0.004);
  } else {
    scene.fog = null;
  }

  controls.update();
  composer.render();
}

animate();

/* Resize */
window.addEventListener('resize', () => {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
});
