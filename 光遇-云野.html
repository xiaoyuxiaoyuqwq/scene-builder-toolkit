<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { EffectComposer } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

const S = Math.sin, C = Math.cos, R = Math.random;

const scene = new THREE.Scene();

// ── Richer sky gradient ──
const cvs = document.createElement('canvas');
cvs.width = 2; cvs.height = 512;
const ctx = cvs.getContext('2d');
const g = ctx.createLinearGradient(0,0,0,512);
g.addColorStop(0,  '#0a0520');
g.addColorStop(0.15,'#2a1040');
g.addColorStop(0.3, '#6a2a4a');
g.addColorStop(0.45,'#cc6644');
g.addColorStop(0.6, '#eeaa66');
g.addColorStop(0.75,'#ffcc88');
g.addColorStop(0.88,'#ffddbb');
g.addColorStop(1,   '#ffe8d0');
ctx.fillStyle = g; ctx.fillRect(0,0,2,512);
scene.background = new THREE.CanvasTexture(cvs);
scene.fog = new THREE.FogExp2(0xeeddcc, 0.0025);

const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 200);
camera.position.set(12, 6, 14);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.5, 0.3, 0.05));

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,2,0);
controls.enableDamping = true; controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI/2.1;
controls.minDistance = 4; controls.maxDistance = 40;
controls.update();

// ── Warm golden lighting ──
const ambient = new THREE.AmbientLight(0xffddbb, 0.3);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0xffccaa, 0x664422, 0.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffdd99, 2.2);
sun.position.set(8, 14, -6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 30;
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
scene.add(sun);
const back = new THREE.DirectionalLight(0xff8844, 0.5);
back.position.set(-5, 3, -8);
scene.add(back);
const rim = new THREE.DirectionalLight(0x88ccff, 0.2);
rim.position.set(0, -2, 6);
scene.add(rim);

// ── Ground ──
const groundMat = new THREE.MeshStandardMaterial({ color:0xccbb88, roughness:0.9 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60,60), groundMat);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
scene.add(ground);

// ── Grassy hills with color variation ──
const hillColors = [0xccaa66, 0xddbb66, 0xbb9955, 0xccbb55, 0xddcc77];
function mound(x,z,r,h){
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(r, 16, 12, 0, Math.PI*2, 0, Math.PI/2),
    new THREE.MeshStandardMaterial({ color: hillColors[Math.floor(R()*hillColors.length)], roughness:0.9 })
  );
  m.scale.set(1, h/r, 1); m.position.set(x, 0, z);
  m.receiveShadow = true; scene.add(m);
}
mound(0,0,6,0.8); mound(-5,4,4,0.5); mound(5,4,4,0.5);
mound(-3,-3,3,0.4); mound(4,-2,3.5,0.45); mound(0,6,5,0.6);
mound(-2,5,2.5,0.35); mound(2,5,2.5,0.35);

// ── Distant mountains ──
function mountain(x,z,w,h,d){
  const mat = new THREE.MeshStandardMaterial({
    color: 0x887766, roughness:0.9, transparent:true, opacity:0.15
  });
  const m = new THREE.Mesh(new THREE.ConeGeometry(w, h, 6), mat);
  m.position.set(x, h/2-0.2, z); m.rotation.y = R()*Math.PI;
  scene.add(m);
}
mountain(-15, -15, 5, 3, 5); mountain(-10, -18, 4, 2.5, 4);
mountain(12, -16, 6, 3.5, 6); mountain(18, -12, 4, 2, 4);

// ── The Great Tree (centerpiece) ──
function greatTree(x,z,s){
  const g = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color:0x7a6a4a, roughness:0.85 });

  // Main trunk
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08*s, 0.22*s, 1.2*s, 8), trunkMat);
  trunk.position.y = 0.6*s; trunk.castShadow = true;
  trunk.rotation.z = 0.02; trunk.rotation.x = 0.01;
  g.add(trunk);

  // Thick main branches (spreading wide)
  for (let i=0; i<8; i++) {
    const a = (i/8)*Math.PI*2 + R()*0.2;
    const len = (0.3 + R()*0.4)*s;
    const br = new THREE.Mesh(
      new THREE.CylinderGeometry(0.03*s, 0.07*s, len, 5),
      trunkMat
    );
    br.position.set(C(a)*0.12*s, 0.5*s + R()*0.3*s, S(a)*0.12*s);
    br.rotation.z = C(a)*(0.5+R()*0.2);
    br.rotation.x = S(a)*(0.5+R()*0.2);
    br.castShadow = true; g.add(br);

    // Sub-branches
    const subCount = 2 + Math.floor(R()*2);
    for (let j=0; j<subCount; j++) {
      const sa = a + (R()-0.5)*0.8;
      const slen = (0.1 + R()*0.2)*s;
      const sb = new THREE.Mesh(
        new THREE.CylinderGeometry(0.01*s, 0.025*s, slen, 4),
        trunkMat
      );
      sb.position.set(C(a)*0.12*s + C(sa)*0.1*s, 0.6*s + R()*0.3*s, S(a)*0.12*s + S(sa)*0.1*s);
      sb.rotation.z = C(sa)*(0.6+R()*0.2);
      sb.rotation.x = S(sa)*(0.6+R()*0.2);
      g.add(sb);
    }
  }

  // Crown: dense clusters for a lush, natural silhouette
  const leafTones = [0xddbb88, 0xeec999, 0xccaa77, 0xeeddaa, 0xddcc99, 0xeebb88, 0xeeddbb];
  const crownY = 0.7*s, crownR = 0.7*s;

  // Inner dense core
  for (let c=0; c<18; c++) {
    const a = R()*Math.PI*2;
    const r = R()*0.4*s;
    const y = crownY + (R()-0.3)*0.5*s;
    const cs = (0.07 + R()*0.10)*s;
    const col = leafTones[Math.floor(R()*leafTones.length)];
    const mat = new THREE.MeshStandardMaterial({ color:col, roughness:0.5, emissive:col, emissiveIntensity:0.05 });
    for (let j=0; j<6; j++) {
      const l = new THREE.Mesh(new THREE.SphereGeometry(cs*(0.5+R()*0.6), 5, 5), mat);
      l.position.set(C(a)*r+(R()-0.5)*cs, y+(R()-0.5)*cs, S(a)*r+(R()-0.5)*cs);
      l.scale.set(1, 0.5+R()*0.5, 1); g.add(l);
    }
  }

  // Middle layer
  for (let c=0; c<16; c++) {
    const a = R()*Math.PI*2;
    const r = (0.2 + R()*0.4)*s;
    const y = crownY + (R()-0.3)*0.5*s;
    const cs = (0.06 + R()*0.08)*s;
    const col = leafTones[Math.floor(R()*leafTones.length)];
    const mat = new THREE.MeshStandardMaterial({ color:col, roughness:0.4, emissive:col, emissiveIntensity:0.04 });
    for (let j=0; j<5; j++) {
      const l = new THREE.Mesh(new THREE.SphereGeometry(cs*(0.4+R()*0.7), 5, 5), mat);
      l.position.set(C(a)*r+(R()-0.5)*cs*0.8, y+(R()-0.5)*cs*0.8, S(a)*r+(R()-0.5)*cs*0.8);
      l.scale.set(1, 0.5+R()*0.5, 1); g.add(l);
    }
  }

  // Outer silhouette (spread out, giving the tree its distinctive shape)
  for (let c=0; c<14; c++) {
    const a = R()*Math.PI*2;
    const r = (0.4 + R()*0.45)*s;
    const y = crownY + (R()-0.3)*0.4*s;
    const cs = (0.04 + R()*0.06)*s;
    const col = leafTones[Math.floor(R()*leafTones.length)];
    const mat = new THREE.MeshStandardMaterial({ color:col, roughness:0.4, emissive:col, emissiveIntensity:0.03 });
    for (let j=0; j<4; j++) {
      const l = new THREE.Mesh(new THREE.SphereGeometry(cs*(0.4+R()*0.8), 5, 5), mat);
      l.position.set(C(a)*r+(R()-0.5)*cs, y+(R()-0.5)*cs, S(a)*r+(R()-0.5)*cs);
      l.scale.set(1, 0.4+R()*0.6, 1); g.add(l);
    }
  }

  // Hanging leaf tendrils (draping down like willow, very Sky)
  const tendrilMat = new THREE.MeshStandardMaterial({ color:0xccbb66, roughness:0.5, emissive:0xccaa55, emissiveIntensity:0.03 });
  for (let i=0; i<20; i++) {
    const a = R()*Math.PI*2;
    const r = (0.2 + R()*0.5)*s;
    const len = (0.1 + R()*0.25)*s;
    for (let j=0; j<4; j++) {
      const seg = new THREE.Mesh(
        new THREE.SphereGeometry(0.012*s*(1-j*0.2), 4, 4),
        tendrilMat
      );
      seg.position.set(C(a)*r, crownY+0.2*s - j*len/4, S(a)*r);
      g.add(seg);
    }
  }

  g.position.set(x,0,z);
  return g;
}
scene.add(greatTree(0,0,2.8));

// ── Smaller companion trees ──
function smallTree(x,z,s){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.025*s,0.055*s,0.5*s,5),
    new THREE.MeshStandardMaterial({ color:0x7a6a4a, roughness:0.85 }));
  trunk.position.y = 0.25*s; g.add(trunk);
  const cols = [0xddbb88,0xeec999,0xccaa77,0xeeddbb];
  for (let c=0; c<6; c++) {
    const a = R()*Math.PI*2, cr = (0.05+R()*0.2)*s, cs = (0.04+R()*0.05)*s;
    const mat = new THREE.MeshStandardMaterial({ color:cols[Math.floor(R()*cols.length)], roughness:0.5, emissive:cols[Math.floor(R()*cols.length)], emissiveIntensity:0.03 });
    for (let j=0; j<4; j++) {
      const l = new THREE.Mesh(new THREE.SphereGeometry(cs*(0.5+R()*0.6),4,4), mat);
      l.position.set(C(a)*cr+(R()-0.5)*cs, (0.3+R()*0.2)*s, S(a)*cr+(R()-0.5)*cs);
      g.add(l);
    }
  }
  g.position.set(x,0,z); scene.add(g);
}
smallTree(-4.5,2,1.0); smallTree(4.5,2,1.0);
smallTree(-3.5,-1.5,0.8); smallTree(3.5,-1.5,0.9);
smallTree(-1.5,4.5,0.8); smallTree(1.5,4.5,0.8);

// ── Stone ruins ──
function stoneArch(x,z,s){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0xccbbaa, roughness:0.9 });
  const matD = new THREE.MeshStandardMaterial({ color:0xbbaa99, roughness:0.9 });
  [-0.4*s,0.4*s].forEach(dx=>{
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.06*s,0.08*s,0.8*s,6), mat);
    p.position.set(dx,0.4*s,0); p.castShadow=true; g.add(p);
    // Capital
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.1*s,0.08*s,0.04*s,6), matD);
    cap.position.set(dx,0.82*s,0); g.add(cap);
  });
  const beam = new THREE.Mesh(new THREE.BoxGeometry(0.9*s,0.10*s,0.15*s), mat);
  beam.position.set(0,0.85*s,0); beam.castShadow=true; g.add(beam);
  // Arch curve
  const curve = new THREE.Mesh(new THREE.TorusGeometry(0.15*s,0.03*s,6,8,Math.PI), mat);
  curve.position.set(0,0.9*s,0); curve.rotation.x=Math.PI/2; g.add(curve);
  g.position.set(x,0,z); scene.add(g);
}
stoneArch(-6,-1,1.2); stoneArch(6,-1,1.2);
stoneArch(-5.5,3,1.0); stoneArch(5.5,3,1.0);

function pillar(x,z,h){
  const mat = new THREE.MeshStandardMaterial({ color:0xccbbaa, roughness:0.9 });
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,h,6), mat);
  p.position.set(x,h/2,z); p.castShadow=true; scene.add(p);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.12,0.06,6), mat);
  cap.position.set(x,h,z); scene.add(cap);
}
pillar(-2,-2.5,0.6); pillar(2,-2.5,0.6);
pillar(-1.5,4,0.5); pillar(1.5,4,0.5);

// ── Light mantas (elegant) ──
function manta(x,y,z,s){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color:0xffeedd, emissive:0xffdd99, emissiveIntensity:0.6, transparent:true, opacity:0.5 });
  const glowMat = new THREE.MeshStandardMaterial({ color:0xffdd99, emissive:0xffdd99, emissiveIntensity:2, transparent:true, opacity:0.15 });

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.10*s,8,8), bodyMat);
  body.scale.set(1.8,0.25,0.8); g.add(body);
  const aura = new THREE.Mesh(new THREE.SphereGeometry(0.18*s,8,8), glowMat);
  g.add(aura);

  // Wings as curved geometry
  [-1,1].forEach(side=>{
    const wing = new THREE.Mesh(
      new THREE.PlaneGeometry(0.28*s, 0.06*s),
      new THREE.MeshStandardMaterial({ color:0xffeedd, emissive:0xffdd99, emissiveIntensity:0.4, transparent:true, opacity:0.25, side:THREE.DoubleSide })
    );
    wing.position.set(0,0,side*0.06*s);
    wing.rotation.x = side*0.5;
    g.add(wing);
  });
  // Tail streamer
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.003*s,0.001*s,0.4*s,4),
    new THREE.MeshStandardMaterial({ color:0xffeedd, transparent:true, opacity:0.2 }));
  tail.position.set(-0.18*s,0,0); tail.rotation.z=0.4; g.add(tail);

  g.position.set(x,y,z); return g;
}
const mantas = [];
for(let i=0;i<5;i++){
  const a=R()*Math.PI*2, r=3+R()*5;
  const m=manta(C(a)*r, 2.5+R()*2.5, S(a)*r, 1.0);
  scene.add(m); mantas.push(m);
}

// ── Candles (arranged in curved paths) ──
function candle(x,y,z,s){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.018*s,0.022*s,0.07*s,6),
    new THREE.MeshStandardMaterial({ color:0xeecbaa, roughness:0.6, emissive:0xffeecc, emissiveIntensity:0.05 }));
  body.position.y = 0.035*s; g.add(body);
  const flame = new THREE.Mesh(new THREE.SphereGeometry(0.012*s,6,6),
    new THREE.MeshStandardMaterial({ color:0xffdd88, emissive:0xffaa44, emissiveIntensity:4 }));
  flame.position.y = 0.08*s; g.add(flame);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.035*s,6,6),
    new THREE.MeshStandardMaterial({ color:0xffaa44, emissive:0xffaa44, emissiveIntensity:1.5, transparent:true, opacity:0.1 }));
  glow.position.y = 0.08*s; g.add(glow);
  const light = new THREE.PointLight(0xffaa44, 0.4, 3);
  light.position.y = 0.09*s; g.add(light);
  g.position.set(x,y,z); return g;
}
// Curved candle paths
for(let ring=0; ring<3; ring++){
  const count = 8 + ring*4;
  const radius = 1.5 + ring*0.8;
  for(let i=0; i<count; i++){
    const a = (i/count)*Math.PI*2 + ring*0.3;
    const r = radius + (R()-0.5)*0.5;
    const rr = 0.5 + R()*0.3;
    const c = candle(C(a)*r, 0.02, S(a)*r*rr, 1.0);
    scene.add(c);
  }
}
// Scattered candles
for(let i=0; i<8; i++){
  const a=R()*Math.PI*2, r=0.8+R()*1.0;
  const c = candle(C(a)*r, 0.02, S(a)*r, 1.0);
  scene.add(c);
}

// ── Cloud sea ──
const cloudGroup = new THREE.Group();
const cloudMat = new THREE.MeshStandardMaterial({ color:0xffddaa, transparent:true, opacity:0.06, roughness:0.5 });
for(let i=0;i<120;i++){
  const a=R()*Math.PI*2, r=5+R()*12, s=0.3+R()*1.0;
  const c = new THREE.Mesh(new THREE.SphereGeometry(s,6,6), cloudMat);
  c.position.set(C(a)*r, -0.3+R()*0.4, S(a)*r);
  c.scale.set(1.5+R()*0.5, 0.2+R()*0.2, 1);
  cloudGroup.add(c);
}
scene.add(cloudGroup);

// ── Floating islands ──
function floatIsland(x,y,z,s){
  const g = new THREE.Group();
  const islMat = new THREE.MeshStandardMaterial({ color:0xccaa88, roughness:0.9 });
  const grsMat = new THREE.MeshStandardMaterial({ color:0xccbb66, roughness:0.9 });
  const isl = new THREE.Mesh(new THREE.SphereGeometry(s,8,6,0,Math.PI*2,0,Math.PI/2), islMat);
  g.add(isl);
  const grs = new THREE.Mesh(new THREE.SphereGeometry(s*0.9,8,6,0,Math.PI*2,0,Math.PI/3), grsMat);
  grs.position.y = s*0.3; g.add(grs);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.02*s,0.04*s,0.2*s,4),
    new THREE.MeshStandardMaterial({ color:0x7a6a4a }));
  trunk.position.y = s*0.4; g.add(trunk);
  for(let i=0;i<5;i++){
    const l = new THREE.Mesh(new THREE.SphereGeometry(0.03*s,4,4),
      new THREE.MeshStandardMaterial({ color:0xddbb88 }));
    l.position.set((R()-0.5)*0.1*s, s*0.5+R()*0.08*s, (R()-0.5)*0.1*s);
    g.add(l);
  }
  g.position.set(x,y,z); scene.add(g);
}
floatIsland(-8, 2.5, -10, 0.8);
floatIsland(9, 3.0, -12, 0.7);
floatIsland(5, 2.0, -14, 0.6);
floatIsland(-10, 1.8, -6, 0.5);

// ── Stars ──
const starBuf = new THREE.BufferGeometry();
const starPos = new Float32Array(400*3);
for(let i=0;i<400;i++){
  const r=40+R()*50, th=R()*Math.PI*2, ph=Math.acos(2*R()-1);
  starPos[i*3]=r*Math.sin(ph)*Math.cos(th);
  starPos[i*3+1]=Math.abs(r*Math.cos(ph));
  starPos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
}
starBuf.setAttribute('position',new THREE.BufferAttribute(starPos,3));
scene.add(new THREE.Points(starBuf, new THREE.PointsMaterial({ color:0xffffff, size:0.08, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending })));

// ── Light motes ──
const moteBuf = new THREE.BufferGeometry();
const motePos = new Float32Array(150*3), moteSpd = new Float32Array(150);
for(let i=0;i<150;i++){
  const a=R()*Math.PI*2, r=R()*9;
  motePos[i*3]=C(a)*r; motePos[i*3+1]=0.5+R()*3.5; motePos[i*3+2]=S(a)*r;
  moteSpd[i]=0.5+R()*1.5;
}
moteBuf.setAttribute('position',new THREE.BufferAttribute(motePos,3));
const motes = new THREE.Points(moteBuf, new THREE.PointsMaterial({ color:0xffdd99, size:0.02, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending }));
scene.add(motes);

// ── Butterfly swarm ──
function bfly(x,y,z){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0xffeecc, emissive:0xffdd88, emissiveIntensity:0.8, transparent:true, opacity:0.25, side:THREE.DoubleSide });
  [-1,1].forEach(side=>{
    const w = new THREE.Mesh(new THREE.PlaneGeometry(0.04,0.03), mat);
    w.position.set(side*0.02,0,0); w.rotation.y=side*0.3; g.add(w);
  });
  g.position.set(x,y,z); scene.add(g); return g;
}
const butterflies = [];
for(let i=0;i<10;i++){
  const a=R()*Math.PI*2, r=1+R()*3.5;
  const b = bfly(C(a)*r, 0.3+R()*0.8, S(a)*r);
  butterflies.push(b);
}

// ── Fireflies ──
const ffBuf = new THREE.BufferGeometry();
const ffPos = new Float32Array(50*3);
for(let i=0;i<50;i++){ffPos[i*3]=(R()-0.5)*10;ffPos[i*3+1]=0.1+R()*0.8;ffPos[i*3+2]=(R()-0.5)*8;}
ffBuf.setAttribute('position',new THREE.BufferAttribute(ffPos,3));
const fireflies = new THREE.Points(ffBuf, new THREE.PointsMaterial({ color:0xffee88, size:0.025, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending }));
scene.add(fireflies);

// ── Animation ──
let t=0;
function animate(){
  requestAnimationFrame(animate);
  t += 0.006;

  // Mantas - gentle floating
  mantas.forEach((m, idx) => {
    m.position.x += S(t*0.3+idx*1.5)*0.005;
    m.position.y += S(t*0.35+idx*2)*0.004;
    m.position.z += C(t*0.25+idx*1.5)*0.005;
    m.rotation.y += 0.0008;
    m.rotation.x = S(t*0.4+idx*0.7)*0.04;
    // Wing flap
    const wings = m.children.filter(c => c.geometry && c.geometry.type === 'PlaneGeometry');
    wings.forEach((w, wi) => {
      w.rotation.x = (wi===0?-1:1)*(0.4 + S(t*1.5+idx)*0.2);
    });
  });

  // Butterflies
  butterflies.forEach((b, idx) => {
    b.position.x += S(t*0.6+idx*1.3)*0.004;
    b.position.y += S(t*0.8+idx*2)*0.003;
    b.rotation.y = S(t*0.4+idx)*0.5;
    b.children.forEach(ch => {
      if(ch.isMesh) ch.rotation.y = (ch.position.x>0?-1:1)*(0.3+S(t*3+idx)*0.15);
    });
  });

  // Motes drift
  const ma = motes.geometry.attributes.position.array;
  for(let i=0; i<ma.length; i+=3){
    ma[i] += S(t*0.5+i*0.05)*0.003;
    ma[i+1] += C(t*0.4+i*0.08)*0.002;
    ma[i+2] += S(t*0.3+i*0.07)*0.003;
  }
  motes.geometry.attributes.position.needsUpdate = true;

  // Fireflies
  const ff = fireflies.geometry.attributes.position.array;
  for(let i=0; i<ff.length; i+=3){
    ff[i] += S(t*1.5+i)*0.004;
    ff[i+1] += C(t*1.2+i*0.5)*0.002;
    ff[i+2] += S(t*1.0+i*0.3)*0.004;
  }
  fireflies.geometry.attributes.position.needsUpdate = true;

  // Candle flicker
  scene.children.filter(c=>c.isGroup&&c.children.some(ch=>ch instanceof THREE.PointLight))
    .forEach((g,idx)=>{const l=g.children.find(ch=>ch instanceof THREE.PointLight);if(l)l.intensity=0.3+S(t*3+idx*2)*0.1;});

  controls.update();
  composer.render();
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  composer.setSize(innerWidth,innerHeight);
});
</script>
<div id="info">🖱 拖拽 · 滚轮 · 云野 · 光遇</div>
